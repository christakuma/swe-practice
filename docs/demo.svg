<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 745"
     width="980" height="745" font-size="13"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     xml:space="preserve" role="img" aria-label="A terminal replaying practice solve git/revert-a-pushed-commit, which produces the right files and fails the history-preserved check.">
  <style>
