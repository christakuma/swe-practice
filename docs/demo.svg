    .l27 { animation-name: r27 }
    @keyframes r27 { 0%, 52.8% { opacity: 0 } 52.8%, 100% { opacity: 1 } }
    .l28 { animation-name: r28 }
    @keyframes r28 { 0%, 54.686% { opacity: 0 } 54.686%, 100% { opacity: 1 } }
    .l29 { animation-name: r29 }
    @keyframes r29 { 0%, 56.571% { opacity: 0 } 56.571%, 100% { opacity: 1 } }
