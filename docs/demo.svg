    .l20 { animation-name: r20 }
    @keyframes r20 { 0%, 39.6% { opacity: 0 } 39.6%, 100% { opacity: 1 } }
    .l21 { animation-name: r21 }
    @keyframes r21 { 0%, 41.486% { opacity: 0 } 41.486%, 100% { opacity: 1 } }
    .l22 { animation-name: r22 }
    @keyframes r22 { 0%, 43.371% { opacity: 0 } 43.371%, 100% { opacity: 1 } }
    .l23 { animation-name: r23 }
    @keyframes r23 { 0%, 45.257% { opacity: 0 } 45.257%, 100% { opacity: 1 } }
