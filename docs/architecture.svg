<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584"
     font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
     role="img"
     aria-label="Dependencies point inward. Driving adapters — the CLI and the web app — call the application layer; the application layer and the domain sit at the centre; driven adapters implement the domain's ports. composition.py is the only module that imports across layers, and a test fails the build on a violation.">
  <style>
    .box { stroke: #94a3b8; stroke-width: 1.25; rx: 10 }
    .h { font-size: 13.5px; font-weight: 700; fill: #0f172a }
    .m { font-size: 12px; fill: #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .d { font-size: 11.5px; fill: #475569 }
    .cap { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .08em }
    .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#tip) }
    .al { font-size: 11px; font-weight: 600; fill: #334155 }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="940" height="584" fill="#ffffff"/>

  <text class="cap" x="24" y="34">DRIVING ADAPTERS</text>
  <text class="cap" x="316" y="34">THE CORE</text>
  <text class="cap" x="916" y="34" text-anchor="end">DRIVEN ADAPTERS</text>

  <!-- driving -->
  <rect class="box" x="24" y="48" width="212" height="238" fill="#eef2ff"/>
  <text class="h" x="40" y="72">interface/</text>
  <text class="m" x="40" y="96">cli/</text>
  <text class="d" x="40" y="113">up · solve · start · submit · gc</text>
  <text class="m" x="40" y="137">web/</text>
  <text class="d" x="40" y="154">FastAPI, Jinja fragments, HTMX.</text>
  <text class="d" x="40" y="171">No JSON API, no SPA (ADR 0007).</text>
  <text class="d" x="40" y="205">Two adapters over one core, which</text>
  <text class="d" x="40" y="222">is the point of having both: if the</text>
  <text class="d" x="40" y="239">core were secretly coupled to HTTP,</text>
  <text class="d" x="40" y="256">the CLI would not work.</text>

  <!-- core -->
  <rect class="box" x="288" y="48" width="364" height="396" fill="#f8fafc"/>

  <rect class="box" x="308" y="68" width="324" height="118" fill="#ffffff"/>
  <text class="h" x="324" y="92">application/</text>
  <text class="d" x="324" y="112">17 use cases, one job each. Orchestrates;</text>
  <text class="d" x="324" y="129">owns no rule a test would need a disk for.</text>
  <text class="m" x="324" y="152">StartAttempt · SubmitScenario</text>
  <text class="m" x="324" y="170">ReviewQueue · SummariseProgress</text>

  <rect class="box" x="308" y="206" width="324" height="218" fill="#ecfdf5"/>
  <text class="h" x="324" y="230">domain/</text>
  <text class="m" x="324" y="254">Attempt · Exercise · Verdict · ReviewCard</text>
  <text class="m" x="324" y="276">checks/ · drills/ — 30 pure assertions</text>
  <text class="d" x="324" y="293">is_ancestor, tree_matches, table_matches, query_plan_matches …</text>
  <text class="m" x="324" y="315">scheduling/ — SM-2 and FSRS, one port</text>
  <text class="m" x="324" y="337">ports.py — 14 Protocols</text>
  <text class="d" x="324" y="354">Structural, so no adapter imports the domain</text>
  <text class="d" x="324" y="371">to satisfy one (ADR 0002).</text>
  <text class="d" x="324" y="398">Imports no adapter, no interface and no I/O</text>
  <text class="d" x="324" y="415">module at all. 100% covered, by the gate.</text>

  <!-- driven -->
  <rect class="box" x="704" y="48" width="212" height="238" fill="#fff7ed"/>
  <text class="h" x="720" y="72">adapters/</text>
  <text class="m" x="720" y="96">content/</text>
  <text class="d" x="720" y="113">62 exercises, as YAML</text>
  <text class="m" x="720" y="137">sandbox/</text>
  <text class="d" x="720" y="154">the only subprocess</text>
  <text class="m" x="720" y="178">git/ · kata/ · sql/</text>
  <text class="d" x="720" y="195">real git; a pytest, or SQLite in memory</text>
  <text class="m" x="720" y="219">persistence/</text>
  <text class="d" x="720" y="236">SQLite, hand-written SQL</text>
  <text class="d" x="720" y="260">clock · ids · editor</text>
  <text class="d" x="720" y="277">browser · watcher</text>

  <!-- arrows -->
  <path class="arrow" d="M236 123 L300 123"/>
  <text class="al" x="268" y="113" text-anchor="middle">calls</text>

  <path class="arrow" d="M704 123 L640 123"/>
  <text class="al" x="678" y="113" text-anchor="middle">implements</text>
  <text class="al" x="678" y="143" text-anchor="middle">the ports</text>

  <!-- the one wiring point -->
  <rect class="box" x="24" y="470" width="892" height="52" fill="#ffffff"/>
  <text class="m" x="44" y="492">composition.py</text>
  <text class="d" x="150" y="492">builds the object graph both adapters are handed — the only module that imports across layers.</text>
  <text class="d" x="44" y="511">Services holds ports, not implementations, so mypy checks adapter conformance at the one place it can.</text>

  <text class="d" x="24" y="548">Dependencies point inward. tests/unit/test_architecture.py AST-walks src/ and fails the build on a violation — including a deferred import</text>
  <text class="d" x="24" y="566">inside a function, a second package that starts a process, and a package that speaks SQL without being named as one of the two that may.</text>
</svg>
