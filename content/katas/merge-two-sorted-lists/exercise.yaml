schema_version: 1
id: katas/merge-two-sorted-lists
kind: kata
title: Merge Two Sorted Lists
difficulty: easy
tags: [linked-lists, pointers, merging]
estimated_minutes: 15

prompt: |
  Two sorted linked lists come in. Return the head of one sorted list holding
  all of their nodes.

  Either list may be empty; two empty lists merge to an empty list. Equal
  values may come out in either order.

  Splice the nodes you were given into one chain. Collecting the values and
  building a fresh list gets the right answer and skips the exercise.

  The tests build lists with the `ListNode` class in the stub, and they check
  the nodes you return are the nodes they handed you.

hints:
  - "Both inputs are already sorted, so the smallest unused node is always at
     the front of one list or the other. You never have to search for it."
  - "Take the smaller front node, append it, and advance only that list. Repeat
     until one list runs out."
  - "When one list runs out the other is already sorted and already linked --
     attach the whole remainder in one move rather than walking it node by
     node."
  - "The first node is awkward: the result has no tail yet, so there is nothing
     to append to. A throwaway node in front of the list removes that special
     case, and you return its `next` at the end."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n + m)"
    expected_space: "O(1)"
  constraints:
    - "Each list has between 0 and 100 nodes; an empty list is None."
    - "Each list is in ascending order, and equal values may repeat."
    - "-10**4 <= node.value <= 10**4"
  examples:
    - input: |
        first = ListNode(1, ListNode(3, ListNode(5)))
        second = ListNode(2, ListNode(4))
        merge_two_lists(first, second)
      output: |
        ListNode(1, ListNode(2, ListNode(3, ListNode(4, ListNode(5)))))
      explanation: |
        1 -> 3 -> 5 and 2 -> 4 become 1 -> 2 -> 3 -> 4 -> 5.
    - input: |
        merge_two_lists(None, ListNode(7, ListNode(8)))
      output: |
        ListNode(7, ListNode(8))
      explanation: |
        With one list empty, the other is already the answer.
    - input: |
        merge_two_lists(None, None)
      output: |
        None
