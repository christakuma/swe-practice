schema_version: 1
id: katas/detect-a-cycle-in-a-linked-list
kind: kata
title: Does This Linked List Loop
difficulty: medium
tags: [linked-lists, two-pointers]
estimated_minutes: 18

prompt: |
  Decide whether following `next_node` from the head of a singly linked list
  ever revisits a node.

  A list that ends in `None` has no cycle, however long it is, and neither does
  an empty list. A cycle can close anywhere: the last node may point back at
  the head, at a node part-way along, or at itself.

  Solve it in **O(1) extra space** — a set of visited nodes is correct and is
  not what this kata is for.

  The tests build lists with the `ListNode` class in the stub.

hints:
  - "A set of seen nodes answers it immediately and costs O(n) space. Keep that
     version in mind as the thing to beat."
  - "Two pointers moving at different speeds. If the list ends, the faster one
     falls off it. If it loops, both are inside the loop forever — and then what
     happens to the distance between them?"
  - "Inside the loop, the fast pointer gains one position on the slow one every
     step. A gap that shrinks by exactly one cannot step over zero, so they meet."
  - "`while fast is not None and fast.next_node is not None`. Both halves are
     needed: an odd-length list lands the fast pointer on the last node, an
     even-length one lands it just short."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(1)"
  constraints:
    - "The list has between 0 and 10**5 nodes; an empty list is None."
    - "An acyclic list may be 10**5 nodes long, far deeper than Python will recurse."
    - "Values tell you nothing: two nodes are the same node only if they are the same object."
  examples:
    - input: |
        third = ListNode(3)
        second = ListNode(2, third)
        head = ListNode(1, second)
        has_cycle(head)
      output: |
        False
      explanation: |
        1 -> 2 -> 3 -> None. The list ends.
    - input: |
        third = ListNode(3)
        second = ListNode(2, third)
        head = ListNode(1, second)
        third.next_node = second
        has_cycle(head)
      output: |
        True
      explanation: |
        1 -> 2 -> 3 -> 2 -> 3 -> ... The last node points back at the second.
    - input: |
        node = ListNode(1)
        node.next_node = node
        has_cycle(node)
      output: |
        True
      explanation: |
        The smallest possible cycle: one node pointing at itself.
    - input: |
        has_cycle(None)
      output: |
        False
