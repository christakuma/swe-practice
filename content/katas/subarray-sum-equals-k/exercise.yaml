schema_version: 1
id: katas/subarray-sum-equals-k
kind: kata
title: Count Slices That Sum to K
difficulty: medium
tags: [arrays, hash-map, prefix-sums]
estimated_minutes: 25

prompt: |
  Count the contiguous, non-empty slices of a list that add up to a target.

  Slices at different positions count separately, and they may overlap.

  Values may be **negative or zero**, which rules out more approaches than it
  looks like. The list may be long enough that trying every slice is too slow.

hints:
  - "Try every slice first — two nested loops with a running sum. It is O(n²)
     and it is the version whose waste you can then see."
  - "A sliding window does not work here. Widening a window usually increases
     its sum, which is what lets you shrink from the left; with negatives,
     widening can make the sum smaller, so there is nothing monotone to
     exploit."
  - "Write `sum(numbers[start:end])` as a difference of two prefix sums. Then a
     slice sums to the target exactly when two prefix sums differ by the
     target — and you are looking for one specific earlier value."
  - "One pass, a running sum, and a dict counting how many times each prefix sum
     has occurred. At each step add `seen[running - target]`. Seed the dict with
     `{0: 1}`, for the empty prefix, or you miss every slice starting at index
     0."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(n)"
  constraints:
    - "0 <= len(numbers) <= 10**5"
    - "-1000 <= numbers[i] <= 1000"
    - "-10**8 <= target <= 10**8"
  examples:
    - input: |
        count_subarrays([1, 1, 1], 2)
      output: |
        2
      explanation: |
        The first two values, and the last two. They overlap, and both count.
    - input: |
        count_subarrays([1, -1, 0], 0)
      output: |
        3
      explanation: |
        [1, -1], [1, -1, 0] and [0].
    - input: |
        count_subarrays([0, 0, 0], 0)
      output: |
        6
      explanation: |
        Every slice of a run of zeros sums to zero: three of length one, two of
        length two and one of length three.
    - input: |
        count_subarrays([1, 2, 3], 7)
      output: |
        0
