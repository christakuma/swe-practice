schema_version: 1
id: katas/is-it-a-subtree
kind: kata
title: Is It a Subtree
difficulty: easy
tags: [trees, recursion, dfs]
estimated_minutes: 18

prompt: |
  Return `True` if `candidate` appears somewhere inside `tree` as a **complete
  subtree** — some node of `tree` whose whole structure below it matches
  `candidate` exactly.

  Complete is the operative word. A node of `tree` with the right value and the
  right children still does not match if one of those children has a child that
  `candidate` lacks.

  An empty candidate is a subtree of anything, including an empty tree. A
  non-empty candidate is never a subtree of an empty tree.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Two different questions are in play: \"are these two trees identical?\"
     and \"does this tree contain that one?\". Write the first as its own
     function and the second becomes short."
  - "At each node of the tree, either the subtree rooted here matches the
     candidate, or the answer is somewhere in the left subtree, or in the right
     one."
  - "The identity check must compare shape, not just values -- a candidate
     matches only if the node's descendants stop exactly where the candidate's
     do."
  - "An extra child below a matching node makes it *not* a match. That is the
     case that separates \"contains these values\" from \"contains this
     subtree\"."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n * m) in the worst case"
    expected_space: "O(h)"
  constraints:
    - "The tree has between 0 and 500 nodes and the candidate between 0 and 100; an empty one is None."
    - "-10**4 <= node.value <= 10**4"
    - "Values may repeat within a tree."
  examples:
    - input: |
        tree = TreeNode(3, TreeNode(4, TreeNode(1), TreeNode(2)), TreeNode(5))
        candidate = TreeNode(4, TreeNode(1), TreeNode(2))
        is_subtree(tree, candidate)
      output: |
        True
      explanation: |
        The node 4 in the tree, with everything below it, is the candidate.

                3                 4
               / \               / \
              4   5             1   2
             / \
            1   2
    - input: |
        tree = TreeNode(
            3,
            TreeNode(4, TreeNode(1), TreeNode(2, TreeNode(0))),
            TreeNode(5),
        )
        candidate = TreeNode(4, TreeNode(1), TreeNode(2))
        is_subtree(tree, candidate)
      output: |
        False
      explanation: |
        The node 4 has the right children, but its 2 has a child of its own that the
        candidate's 2 does not.

                3                 4
               / \               / \
              4   5             1   2
             / \
            1   2
               /
              0
    - input: |
        is_subtree(TreeNode(1), None)
      output: |
        True
