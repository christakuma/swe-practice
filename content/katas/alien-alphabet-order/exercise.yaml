schema_version: 1
id: katas/alien-alphabet-order
kind: kata
title: Alien Alphabet Order
difficulty: hard
tags: [graphs, topological-sort, heap, invariants]
estimated_minutes: 40

prompt: |
  A list of words is sorted according to an unknown alphabet. Work out the
  alphabet.

  Return the characters in order as a string. Where several orderings are
  consistent with the input, return the **lexicographically smallest** one — by
  ordinary Python string comparison — so the answer is unique. Return `""` if
  no ordering is consistent.

  Every character appearing in any word must appear exactly once in the result,
  including characters that no comparison constrains.

  Two ways the input can be inconsistent, and both must give `""`: the
  constraints may form a **cycle**, or a word may be followed by a **proper
  prefix of itself**, which no alphabet permits.

hints:
  - "Each adjacent pair of words gives you exactly one fact: at the first
     position where they differ, the earlier word's character precedes the
     later word's. Positions after that tell you nothing."
  - "If they do not differ anywhere in their common length, the shorter must
     come first. If it does not, the input is impossible -- no alphabet makes
     \"abc\" sort before \"ab\"."
  - "Those facts are edges in a directed graph over the characters, and the
     answer is a topological order of it. A cycle means no answer."
  - "For the *smallest* valid order, always take the available character that
     is smallest. Kahn's algorithm with a min-heap instead of a plain queue
     does exactly that."
  - "Deduplicate the edges. The same pair can be implied by many word pairs,
     and counting it twice leaves an in-degree that never reaches zero."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(total input length + C log C) for C distinct characters"
    expected_space: "O(C^2) worst case for the edges"
  constraints:
    - "0 <= len(words) <= 100"
    - "1 <= len(words[i]) <= 20"
    - "Every word is made of lowercase letters a to z."
    - "The same word may appear more than once."
  examples:
    - input: |
        alien_order(["wrt", "wrf", "er", "ett", "rftt"])
      output: |
        "wertf"
      explanation: |
        Each neighbouring pair gives one fact, from the first position where the two
        words differ: t before f, w before e, r before t, e before r. Chained
        together that is w, e, r, t, f.
    - input: |
        alien_order(["z", "x", "z"])
      output: |
        ""
      explanation: |
        z comes before x and x comes before z. That is a cycle, so no alphabet fits.
    - input: |
        alien_order(["abc", "ab"])
      output: |
        ""
      explanation: |
        "ab" is a proper prefix of "abc", and in any alphabet a prefix sorts first.
    - input: |
        alien_order(["zb", "za"])
      output: |
        "baz"
      explanation: |
        The only fact is b before a. Nothing constrains z, so "baz", "bza" and "zba"
        are all consistent, and "baz" is the smallest of them as a string.
