schema_version: 1
id: katas/find-words-in-a-grid
kind: kata
title: Find Words in a Grid
difficulty: hard
tags: [tries, grids, backtracking, dfs, strings]
estimated_minutes: 40

prompt: |
  A grid of characters and a list of words come in. Return every word from the
  list that can be spelled by a path through the grid, stepping only up, down,
  left or right and using **no cell twice**.

  Return the found words sorted ascending, each one once however many times it
  appears in the list and however many paths spell it. An empty string in the
  list is never returned.

  An empty word list gives `[]`, and so does an empty grid. A word longer than
  the grid has cells cannot be present. Leave the grid as you found it.

  **Running `find-a-word-in-a-grid` once per word is too slow** when the words
  share prefixes — the tests use a list where that costs thousands of
  redundant grid walks. Search the grid **once**, carrying all the words at
  the same time.

hints:
  - "Searching per word repeats the same grid walk for every word sharing a
     prefix. Put the words in a prefix tree and the shared prefixes become
     shared work."
  - "Then the grid search carries a trie node alongside its position. Stepping
     to a neighbour is only worth doing if that character is a child of the
     current node."
  - "Reaching a node marked as a word records it. Keep going afterwards -- a
     longer word may continue from here."
  - "The cell mark still has to be undone on the way out, because the grid is
     the thing with cycles. The trie descent never needs undoing."
  - "Pruning pays: once a word is found, clearing its marker stops it being
     re-found, and a trie node with no children left is a dead end."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 20
  complexity:
    expected_time: "O(cells * 4^longest word) worst case, pruned heavily in practice"
    expected_space: "O(total characters in the word list)"
  signature:
    functions:
      - name: find_words
        summary: "Return the words from `words` that appear in `board`."
        parameters:
          - name: board
            type: list[list[str]]
            description: "a grid of single-character strings. May be empty."
            length: {min: 0, max: 8}
            item_length: {min: 0, max: 8}
          - name: words
            type: list[str]
            description: the words to look for. May be empty or hold duplicates.
            length: {min: 0, max: 100}
            item_length: {min: 0, max: 14}
        returns:
          type: list[str]
          description: >-
            Each present word once, sorted ascending. A path may step up, down, left or
            right and may not reuse a cell.
  notes:
    - Every cell is a single character. Matching is exact, so case matters.
  examples:
    - input: |
        board = [
            ["o", "a", "a", "n"],
            ["e", "t", "a", "e"],
            ["i", "h", "k", "r"],
            ["i", "f", "l", "v"],
        ]
        find_words(board, ["oath", "pea", "eat", "rain"])
      output: |
        ["eat", "oath"]
      explanation: |
        "oath" runs from the top-left corner right, down and down again; "eat"
        starts at the end of the second row and goes up and left. There is no p
        for "pea", and "rain" has its letters but no path joining them.
    - input: |
        board = [
            ["a", "b"],
            ["c", "d"],
        ]
        find_words(board, ["ab", "abdc", "abcd", "aba", "ab"])
      output: |
        ["ab", "abdc"]
      explanation: |
        "ab" is listed twice and returned once. "abcd" would need a diagonal step
        from b to c, and "aba" would need the a twice.
    - input: |
        find_words([], ["a"])
      output: |
        []
