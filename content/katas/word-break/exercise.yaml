schema_version: 1
id: katas/word-break
kind: kata
title: Can This String Be Split Into Words
difficulty: medium
tags: [dynamic-programming, strings, greedy]
estimated_minutes: 25

prompt: |
  Decide whether a string can be split into a sequence of words from a
  dictionary. Words may be reused, and not every word has to be used.

  An empty string is always splittable — by the empty sequence of words.

  Strings may be several hundred characters long, so trying every way to cut
  them is out.

hints:
  - "Try matching the longest word at each step. Then run it on `\"cars\"` with
     `[\"car\", \"ca\", \"rs\"]` — `car` leaves `s`, and the answer needs `ca`
     first."
  - "So a choice early on can only be judged by what happens later. Keep, for
     every position, whether the string *up to* that position can be split."
  - "Position 0 is splittable (nothing to split). Position `i` is splittable if
     some earlier splittable position `j` has `text[j:i]` in the dictionary."
  - "Put the dictionary in a `set`, and bound the inner loop by the length of
     the longest word — there is no point testing slices longer than anything
     in the dictionary."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n * k^2) for a longest word of length k"
    expected_space: "O(n)"
  constraints:
    - "0 <= len(text) <= 1000"
    - "0 <= len(words) <= 1000"
    - "1 <= len(words[i]) <= 20"
    - "Characters are compared exactly."
  examples:
    - input: |
        can_segment("leetcode", ["leet", "code"])
      output: |
        True
    - input: |
        can_segment("applepenapple", ["apple", "pen"])
      output: |
        True
      explanation: |
        "apple", "pen", "apple" — the same word may be used twice.
    - input: |
        can_segment("catsandog", ["cats", "dog", "sand", "and", "cat"])
      output: |
        False
      explanation: |
        "cats and" and "cat sand" both get as far as "og", and no word finishes it.
    - input: |
        can_segment("abcd", ["abc", "ab", "cd"])
      output: |
        True
      explanation: |
        "ab" then "cd". Taking the longest word that fits first picks "abc" and is
        left with a "d" nothing matches.
    - input: |
        can_segment("", ["a"])
      output: |
        True
