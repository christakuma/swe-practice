schema_version: 1
id: katas/invert-a-binary-tree
kind: kata
title: Invert a Binary Tree
difficulty: easy
tags: [trees, recursion, dfs, in-place]
estimated_minutes: 12

prompt: |
  Mirror a binary tree: swap every node's children, all the way down. Return
  the root.

  An empty tree inverts to an empty tree.

  Invert in place by relinking the nodes you were given — the caller keeps the
  root it passed in, so the inversion has to be visible through it. Swapping
  the values between nodes instead of the nodes themselves does not count.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Start at the root. Swap its two children. What is left to do is the same
     problem on each of those two subtrees."
  - "That is the whole algorithm -- there is no bookkeeping and no order to get
     right. Two lines of recursion and a swap."
  - "The base case is the empty tree, which inverts to itself. Returning early
     on None is what stops the recursion at the leaves without a separate leaf
     check."
  - "Swapping before or after recursing both work. Convince yourself why --
     unlike most tree problems, the two orders really are equivalent here."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h) for a tree of height h"
  constraints:
    - "The tree has between 0 and 500 nodes, and may be a single chain that deep."
    - "-10**4 <= node.value <= 10**4"
  examples:
    - input: |
        root = TreeNode(
            4,
            TreeNode(2, TreeNode(1), TreeNode(3)),
            TreeNode(7, TreeNode(6), TreeNode(9)),
        )
        invert(root)
      output: |
        TreeNode(
            4,
            TreeNode(7, TreeNode(9), TreeNode(6)),
            TreeNode(2, TreeNode(3), TreeNode(1)),
        )
      explanation: |
        Every level is mirrored, not only the top one:

                 4                 4
                / \               / \
               2   7     ->      7   2
              / \ / \           / \ / \
             1  3 6  9         9  6 3  1
    - input: |
        root = TreeNode(1, TreeNode(2))
        invert(root)
      output: |
        TreeNode(1, None, TreeNode(2))
      explanation: |
        A lone left child becomes a lone right child.
    - input: |
        root = TreeNode(1, TreeNode(2), TreeNode(3))
        invert(root) is root
      output: |
        True
      explanation: |
        What comes back is the node that went in, with its children swapped.
    - input: |
        invert(None)
      output: |
        None
