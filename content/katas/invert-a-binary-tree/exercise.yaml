schema_version: 1
id: katas/invert-a-binary-tree
kind: kata
title: Invert a Binary Tree
difficulty: easy
tags: [trees, recursion, dfs, in-place]
estimated_minutes: 12

prompt: |
  Mirror a binary tree: swap every node's children, all the way down. Return
  the root.

  ```
       4                 4
      / \               / \
     2   7      ->     7   2
    / \ / \           / \ / \
   1  3 6  9         9  6 3  1
  ```

  An empty tree inverts to an empty tree.

  Invert in place by relinking the nodes you were given — the caller keeps the
  root it passed in, so the inversion has to be visible through it.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Start at the root. Swap its two children. What is left to do is the same
     problem on each of those two subtrees."
  - "That is the whole algorithm -- there is no bookkeeping and no order to get
     right. Two lines of recursion and a swap."
  - "The base case is the empty tree, which inverts to itself. Returning early
     on None is what stops the recursion at the leaves without a separate leaf
     check."
  - "Swapping before or after recursing both work. Convince yourself why --
     unlike most tree problems, the two orders really are equivalent here."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h) for a tree of height h"
