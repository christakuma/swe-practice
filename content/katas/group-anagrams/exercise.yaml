schema_version: 1
id: katas/group-anagrams
kind: kata
title: Group Anagrams
difficulty: medium
tags: [strings, hash-map, grouping]
estimated_minutes: 15

prompt: |
  Group a list of words so that words which are anagrams of one another end up
  in the same group.

  Order matters at both levels: within a group, the words appear in the order
  they appeared in the input, and the groups appear in the order their first
  word appeared.

  Duplicates are words too — `["ab", "ab"]` is one group of two. So are empty
  strings, which are anagrams of one another.

hints:
  - "Comparing every pair of words is the version to write first. It tells you
     what the question really is: what makes two words anagrams, and can you
     decide it without looking at the other word?"
  - "You want a *key*: something you can compute from one word alone, that is
     equal for two words exactly when they are anagrams."
  - "Sorting a word's letters gives such a key. `eat` and `tea` both become
     `aet`. Careful with keys built from `set(word)` — that loses letter counts,
     so `aab` and `abb` collide."
  - "A dict from key to list of words, built in one pass. Python dicts keep
     insertion order, so `list(groups.values())` already has the ordering the
     task asks for."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n k log k) for n words of length k"
    expected_space: "O(n k)"
  constraints:
    - "0 <= len(words) <= 10**4"
    - "0 <= len(words[i]) <= 100"
    - "Characters are compared exactly; case matters."
  examples:
    - input: |
        group_anagrams(["eat", "tea", "tan", "ate", "nat", "bat"])
      output: |
        [["eat", "tea", "ate"], ["tan", "nat"], ["bat"]]
      explanation: |
        "eat" comes first in the input, so its group comes first, and inside it the
        words keep the order they arrived in.
    - input: |
        group_anagrams(["aab", "abb", "baa"])
      output: |
        [["aab", "baa"], ["abb"]]
      explanation: |
        "aab" and "abb" use the same two letters in different quantities, so they
        are not anagrams.
    - input: |
        group_anagrams(["ab", "ab"])
      output: |
        [["ab", "ab"]]
    - input: |
        group_anagrams([])
      output: |
        []
