schema_version: 1
id: katas/add-and-search-a-word
kind: kata
title: Add and Search a Word
difficulty: medium
tags: [tries, strings, dfs, backtracking, recursion]
estimated_minutes: 30

prompt: |
  Build a word store supporting two operations:

  - `add(word)` — store a word. Adding the same word twice changes nothing.
  - `search(pattern)` — does any stored word match the pattern? A `.` in the
    pattern matches **exactly one** character of any kind; every other
    character matches only itself.

  A `.` never matches zero characters and never matches several, so a pattern
  can only match words of its own length. `search("")` is `True` only if `""`
  was added.

  A `.` in a pattern is always a wildcard — there is no way to search for a
  literal dot.

  A pattern of all wildcards may have to look everywhere, but a pattern with
  literal characters must not: `search("b..")` should only descend below `b`.
  The tests check that it does.

hints:
  - "Build on a prefix tree. A pattern with no wildcards is an ordinary trie
     walk -- the wildcards are what turn the walk into a search."
  - "At a literal character there is at most one child to follow. At a `.`
     there are as many as the node has children, and any one of them matching
     is enough."
  - "That is depth-first search with the pattern position as part of the state:
     succeed when the pattern is exhausted *and* the node is a stored word."
  - "No backtracking marks are needed here -- unlike a grid search, the
     recursion never revisits a node, because each step consumes a character of
     the pattern and the pattern only gets shorter."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(len(pattern)) with no wildcards; O(nodes) in the worst case"
    expected_space: "O(total characters added)"
  constraints:
    - "0 <= len(word) <= 20 and 0 <= len(pattern) <= 20"
    - "Words hold any characters at all, not only lowercase letters."
    - "At most 2 * 10**5 calls are made to add and search combined."
  examples:
    - input: |
        store = WordStore()
        store.add("bad")
        store.add("dad")
        store.search(".ad")
      output: |
        True
      explanation: |
        The wildcard stands for one character, so ".ad" matches both stored words.
    - input: |
        store = WordStore()
        store.add("bad")
        store.search("b.")
      output: |
        False
      explanation: |
        One wildcard is exactly one character: "b." is two characters long and
        "bad" is three.
    - input: |
        store = WordStore()
        store.add("bad")
        store.add("dad")
        store.add("mad")
        (store.search("pad"), store.search("b.."), store.search("..."))
      output: |
        (False, True, True)
