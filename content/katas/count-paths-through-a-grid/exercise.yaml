schema_version: 1
id: katas/count-paths-through-a-grid
kind: kata
title: Count Paths Through a Grid
difficulty: medium
tags: [dynamic-programming, grids, counting, recurrence]
estimated_minutes: 20

prompt: |
  A grid is `width` columns wide and `height` rows tall. Starting in the
  top-left cell and moving only **right or down**, count the distinct paths to
  the bottom-right cell.

  If either dimension is zero there is no grid, and so no path. A `1 x 1` grid
  has one path: you are already there.

  Aim for `O(width * height)` time. `O(min(width, height))` space is
  achievable — one row of the table is enough, and it should be the shorter
  one.

hints:
  - "How many ways are there to reach a given cell? You can only have arrived
     from the cell above it or the cell to its left, so it is the sum of those
     two."
  - "The top row and the left column each have exactly one way to reach them --
     straight along the edge. Those are the base cases."
  - "Fill the table row by row. Every cell you need has already been computed:
     the one above is in the previous row, the one to the left is earlier in
     this one."
  - "You never look further back than one row, so keep one row and overwrite it
     in place. `row[c] += row[c - 1]` is the whole update -- work out why the
     value already in `row[c]` is the cell above."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(m * n)"
    expected_space: "O(min(m, n))"
  constraints:
    - "0 <= width <= 10**5 and 0 <= height <= 10**5"
    - "width * height <= 10**6"
    - "The answer is exact however large it is; a float is not accepted."
  examples:
    - input: |
        count_paths(3, 2)
      output: |
        3
      explanation: |
        Three columns and two rows, so every path is two moves right and one down:
        right-right-down, right-down-right or down-right-right.
    - input: |
        count_paths(3, 7)
      output: |
        28
    - input: |
        count_paths(1, 5)
      output: |
        1
      explanation: |
        A single column leaves no choice but to go straight down.
    - input: |
        count_paths(0, 5)
      output: |
        0
      explanation: |
        A grid with no columns has no cells, so there is nowhere to start.
