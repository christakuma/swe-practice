schema_version: 1
id: katas/level-order-traversal
kind: kata
title: Read a Tree Level by Level
difficulty: medium
tags: [trees, bfs, queues]
estimated_minutes: 18

prompt: |
  Return a tree's values grouped by level: one list per level, top to bottom,
  each read left to right.

  An empty tree gives `[]`. Missing children leave no gap — a level holds only
  the nodes that exist.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Depth-first recursion visits a whole subtree before its sibling, so it
     never has a level in hand. You want to visit nodes in the order they appear
     on the page."
  - "That order is breadth-first: a queue, seeded with the root. Take from the
     front, append the children to the back."
  - "A plain breadth-first walk gives you the right *order* and no level
     boundaries. The trick is that at the top of each round, the queue holds
     exactly one level — so read its length first and then drain that many."
  - "Use `collections.deque`, not a list. `list.pop(0)` shifts every remaining
     element, which turns this into a quadratic traversal on a wide tree."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(w) for a tree of maximum width w"
  signature:
    functions:
      - name: level_order
        summary: Return the values level by level, top to bottom, left to right.
        parameters:
          - name: root
            type: TreeNode | None
            description: the root of the tree, or None for an empty tree.
            values: {min: -10**4, max: 10**4}
            nodes: {min: 0, max: 2 * 10**4}
        returns:
          type: list[list[int]]
          description: >-
            One list per level, starting with the root's level. Empty for an empty tree.
  notes:
    - An empty tree is None.
    - A single level may hold thousands of nodes.
  examples:
    - input: |
        root = TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
        level_order(root)
      output: |
        [[3], [9, 20], [15, 7]]
      explanation: |
        One list per level, each from left to right.

                3
               / \
              9  20
                /  \
               15   7
    - input: |
        root = TreeNode(1, TreeNode(2, None, TreeNode(4)), TreeNode(3))
        level_order(root)
      output: |
        [[1], [2, 3], [4]]
      explanation: |
        The bottom level has one node where there is room for four. The three that
        are missing leave nothing behind — no None, no gap.
    - input: |
        level_order(None)
      output: |
        []
