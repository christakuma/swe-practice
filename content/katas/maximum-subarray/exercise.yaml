schema_version: 1
id: katas/maximum-subarray
kind: kata
title: Largest Sum of a Contiguous Slice
difficulty: medium
tags: [arrays, dynamic-programming, kadane]
estimated_minutes: 20

prompt: |
  Return the largest sum achievable by any contiguous, **non-empty** slice of a
  list.

  The slice must be non-empty, which is why an all-negative list answers with
  its least negative value rather than 0.

  The list may be long enough that trying every slice is far too slow.

hints:
  - "Write the O(n²) version first: for each start, extend and track the best.
     Then ask what it recomputes."
  - "Walk the list once and keep one thing: the best slice that *ends at the
     current element*. At each step there are only two candidates for it."
  - "Either you extend the best slice ending at the previous element, or you
     start fresh here. Extend if the previous best was positive; otherwise it
     was only ever dragging you down."
  - "Seed both running values with `numbers[0]`, not with 0. Starting from 0
     silently allows the empty slice, and an all-negative list then answers 0."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(1)"
  constraints:
    - "1 <= len(numbers) <= 10**5"
    - "-10**4 <= numbers[i] <= 10**4"
  examples:
    - input: |
        max_slice_sum([-2, 1, -3, 4, -1, 2, 1, -5, 4])
      output: |
        6
      explanation: |
        The slice [4, -1, 2, 1]. The -1 is worth crossing to reach the 2 and the 1.
    - input: |
        max_slice_sum([1, 2, 3, 4])
      output: |
        10
    - input: |
        max_slice_sum([-3, -1, -2])
      output: |
        -1
