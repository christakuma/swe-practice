schema_version: 1
id: katas/implement-a-trie
kind: kata
title: Implement a Trie
difficulty: medium
tags: [tries, strings, trees, hash-map]
estimated_minutes: 28

prompt: |
  Build a prefix tree supporting three operations:

  - `insert(word)` — add a word. Inserting the same word twice changes nothing.
  - `contains(word)` — is this exact word in the trie?
  - `starts_with(prefix)` — does any stored word begin with this?

  The empty string is a prefix of everything, so `starts_with("")` is `True`
  once anything is stored — and `contains("")` is `True` only if `""` was
  itself inserted. A stored word is a prefix of itself.

  Each operation must be `O(len(word))` — **independent of how many words are
  stored**. A set of strings answers `contains` in `O(1)` and cannot answer
  `starts_with` at all without scanning, which is the point of the structure.

hints:
  - "A trie stores one character per edge, not per node. A node is a position
     in the alphabet of paths, and its children are the characters that may
     follow."
  - "So walking a word is a loop: at each character, step to that child or stop
     because it is absent."
  - "`contains` and `starts_with` are the same walk and differ only in what
     they ask at the end: one needs the node to be marked as a word ending, the
     other only needs the node to exist."
  - "That marker is what separates a stored word from a prefix of one. Without
     it, `contains(\"app\")` is true as soon as `\"apple\"` is inserted."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(len(word)) per operation"
    expected_space: "O(total characters inserted)"
  signature:
    classes:
      - name: Trie
        summary: A prefix tree over strings.
        methods:
          - name: __init__
            summary: Create an empty trie.
          - name: insert
            summary: "Add `word`. Inserting the same word twice changes nothing."
            parameters:
              - name: word
                type: str
                description: the word to add. May be empty.
                length: {min: 0, max: 20}
            returns:
              type: None
          - name: contains
            summary: "Return whether `word` was inserted, exactly."
            parameters:
              - name: word
                type: str
                description: the word to look up.
                length: {min: 0, max: 20}
            returns:
              type: bool
              description: >-
                True if `word` itself was inserted; a prefix of a stored word is not
                enough.
          - name: starts_with
            summary: "Return whether any stored word begins with `prefix`."
            parameters:
              - name: prefix
                type: str
                description: the start to look for. May be empty.
                length: {min: 0, max: 20}
            returns:
              type: bool
              description: "True if some stored word begins with `prefix`, False otherwise."
  notes:
    - Words hold any characters at all, not only lowercase letters.
    - "At most 2 * 10**5 calls are made to the three methods combined."
  examples:
    - input: |
        trie = Trie()
        trie.insert("apple")
        (trie.contains("apple"), trie.contains("app"), trie.starts_with("app"))
      output: |
        (True, False, True)
      explanation: |
        "app" is the start of a stored word, but it was never inserted as a word of
        its own.
    - input: |
        trie = Trie()
        trie.insert("apple")
        trie.insert("app")
        trie.contains("app")
      output: |
        True
      explanation: |
        Now it has been. Both words are stored, though one is a prefix of the other.
    - input: |
        trie = Trie()
        trie.insert("apple")
        (trie.starts_with(""), trie.contains(""))
      output: |
        (True, False)
