schema_version: 1
id: katas/three-sum-to-zero
kind: kata
title: Three Sum to Zero
difficulty: medium
tags: [arrays, two-pointers, sorting]
estimated_minutes: 32

prompt: |
  Return every distinct triple of values from the list that adds up to zero.

  Each triple uses three **different positions**, and each is returned once as
  a tuple sorted ascending. The list of triples must itself be sorted ascending.
  Duplicate values in the input are allowed and must not produce duplicate
  triples.

  Three nested loops is `O(n^3)`. Aim for `O(n^2)`. Leave the list you were
  given in the order you found it.

hints:
  - "Sorting first costs O(n log n), which is free next to the O(n^2) you are
     aiming for -- and it buys two things: a way to search a range from both
     ends, and duplicates sitting next to each other."
  - "Fix the first value and the rest is a two-sum over the remaining suffix,
     looking for a specific target. On *sorted* data that needs no hash map:
     walk one pointer in from each end."
  - "If the pair sums too low, the only way to increase it is to move the left
     pointer right. Too high, move the right pointer left. Each step discards
     one candidate, so the scan is linear."
  - "Deduplicate by skipping, not by filtering at the end. When the fixed value
     equals the previous fixed value, skip it -- every triple it could start was
     already found. Do the same for both pointers after recording a hit."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(n^2)"
    expected_space: "O(1) beyond the output and the sort"
  constraints:
    - "0 <= len(numbers) <= 2000"
    - "-10**5 <= numbers[i] <= 10**5"
    - "Values arrive in no particular order and may repeat."
  examples:
    - input: |
        three_sum([-1, 0, 1, 2, -1, -4])
      output: |
        [(-1, -1, 2), (-1, 0, 1)]
      explanation: |
        There are two -1s, so (-1, -1, 2) is allowed — and (-1, 0, 1), which either
        of them could supply, is still listed only once.
    - input: |
        three_sum([0, 0, 0, 0])
      output: |
        [(0, 0, 0)]
      explanation: |
        Four different ways to choose three positions, all giving the same triple.
    - input: |
        three_sum([1, 2, 3])
      output: |
        []
    - input: |
        three_sum([0, 0])
      output: |
        []
      explanation: |
        A triple needs three positions and there are two.
