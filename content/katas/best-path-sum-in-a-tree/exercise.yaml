schema_version: 1
id: katas/best-path-sum-in-a-tree
kind: kata
title: Best Path Sum in a Tree
difficulty: hard
tags: [trees, dfs, recursion, dynamic-programming]
estimated_minutes: 35

prompt: |
  A path is any sequence of nodes where each consecutive pair is joined by an
  edge, and no node appears twice. It does **not** have to pass through the
  root, and it may turn at most once — up through a node and down its other
  side. Return the largest sum of values along any path.

  The tree is never empty, so there is always at least one path. Values may be
  negative, and a path of one node is allowed — so the answer can be negative.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Every path has a highest node -- the point where it turns. Rather than
     enumerating paths, consider each node as the turning point and ask what
     the best path turning there is."
  - "A path turning at a node is: the best downward path into its left child,
     plus the node, plus the best downward path into its right child. Either
     side may be skipped."
  - "So the recursion has to return something different from what it records.
     It *returns* the best path going straight down from a node; it *records*
     the best path turning at that node. Those are not the same number."
  - "A subtree whose best downward path is negative should be skipped
     entirely -- contributing zero is better than contributing a loss. Clamping
     at zero handles that, and is not the same as clamping the answer."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h)"
  constraints:
    - "The tree has between 1 and 500 nodes, and may be a single chain that deep."
    - "-1000 <= node.value <= 1000"
  examples:
    - input: |
        root = TreeNode(1, TreeNode(2), TreeNode(3))
        best_path_sum(root)
      output: |
        6
      explanation: |
        The path 2, 1, 3 turns at the root and takes every node.

              1
             / \
            2   3
    - input: |
        root = TreeNode(-10, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
        best_path_sum(root)
      output: |
        42
      explanation: |
        The path 15, 20, 7 never touches the root, which would only cost it 10.

             -10
             /  \
            9   20
               /  \
              15   7
    - input: |
        best_path_sum(TreeNode(-3))
      output: |
        -3
      explanation: |
        A single node is a path, and here it is the only one.
