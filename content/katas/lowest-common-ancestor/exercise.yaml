schema_version: 1
id: katas/lowest-common-ancestor
kind: kata
title: Lowest Common Ancestor
difficulty: medium
tags: [trees, recursion, dfs]
estimated_minutes: 22

prompt: |
  Given a binary tree and two values in it, return the value of the **deepest**
  node that has both of them at or below it.

  A node counts as its own ancestor: if one value sits above the other, the
  answer is the upper one, and if the two values are the same, the answer is
  that value.

  This is **not** a search tree — there is no ordering to steer by. Return
  `None` if either value is not in the tree.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Think about what a subtree can report upwards. There are only three useful
     answers: \"the ancestor is here\", \"I contain one of the two values\", and
     \"I contain neither\"."
  - "If the left subtree reports finding something and the right subtree does
     too, then the two values are split across this node — so this node is the
     answer."
  - "If only one side reports anything, pass that report up unchanged. The
     ancestor is somewhere above you, or that one value *is* the ancestor."
  - "Handle the missing-value case separately, before recursing. Without a
     presence check, asking for a value that is not in the tree returns the
     position of the one that is."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h) for a tree of height h"
  constraints:
    - "The tree has between 0 and 500 nodes; an empty tree is None."
    - "-10**9 <= node.value <= 10**9, and no two nodes share a value."
    - "Either value may be absent from the tree, and the two may be equal."
  examples:
    - input: |
        root = TreeNode(
            3,
            TreeNode(5, TreeNode(6), TreeNode(2, TreeNode(7), TreeNode(4))),
            TreeNode(1, TreeNode(0), TreeNode(8)),
        )
        lowest_common_ancestor(root, 5, 1)
      output: |
        3
      explanation: |
        5 and 1 are on opposite sides of the root.

                    3
                 /     \
                5       1
              /   \    /  \
             6     2  0    8
                  / \
                 7   4
    - input: |
        root = TreeNode(
            3,
            TreeNode(5, TreeNode(6), TreeNode(2, TreeNode(7), TreeNode(4))),
            TreeNode(1, TreeNode(0), TreeNode(8)),
        )
        lowest_common_ancestor(root, 7, 4)
      output: |
        2
      explanation: |
        In the same tree, 7 and 4 are both children of 2. The root is a common
        ancestor too, but not the deepest.
    - input: |
        root = TreeNode(
            3,
            TreeNode(5, TreeNode(6), TreeNode(2, TreeNode(7), TreeNode(4))),
            TreeNode(1, TreeNode(0), TreeNode(8)),
        )
        lowest_common_ancestor(root, 5, 4)
      output: |
        5
      explanation: |
        4 is below 5, and a node counts as its own ancestor.
    - input: |
        root = TreeNode(1, TreeNode(2), TreeNode(3))
        lowest_common_ancestor(root, 2, 99)
      output: |
        None
      explanation: |
        99 is not in the tree.
