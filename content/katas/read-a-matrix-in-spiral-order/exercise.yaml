schema_version: 1
id: katas/read-a-matrix-in-spiral-order
kind: kata
title: Read a Matrix in Spiral Order
difficulty: medium
tags: [grids, invariants, scanning]
estimated_minutes: 25

prompt: |
  Return every value of an `m x n` matrix in spiral order: left to right along
  the top row, down the right column, right to left along the bottom row, up
  the left column, then inward and repeat.

  The matrix need not be square, and it may be empty or a single row or column.
  Every value appears in the output exactly once.

  Do not build a grid of visited flags — four boundaries are enough — and leave
  the matrix as you found it.

hints:
  - "Hold four numbers: the first unread row, the last unread row, the first
     unread column, the last unread column. Each of the four passes consumes a
     whole edge and then moves its boundary inward by one."
  - "After the top row is read, `top` increases. After the right column,
     `right` decreases. The loop continues while there is still a row and a
     column left unread."
  - "The bug is on the last ring of a non-square matrix. A single remaining row
     gets read left-to-right by the top pass and then read again backwards by
     the bottom pass."
  - "So guard the bottom and left passes: only walk back along the bottom if
     there is still more than one row left, and only walk up the left column if
     there is still more than one column left."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(m * n)"
    expected_space: "O(1) beyond the output"
  constraints:
    - "0 <= m <= 400 and 0 <= n <= 400, for m rows of n values each."
    - "-10**9 <= matrix[i][j] <= 10**9"
  examples:
    - input: |
        matrix = [
            [1, 2, 3],
            [4, 5, 6],
            [7, 8, 9],
        ]
        spiral_order(matrix)
      output: |
        [1, 2, 3, 6, 9, 8, 7, 4, 5]
      explanation: |
        Round the outside clockwise from the top-left, then the 5 left in the
        middle.
    - input: |
        matrix = [
            [1, 2, 3, 4],
            [5, 6, 7, 8],
        ]
        spiral_order(matrix)
      output: |
        [1, 2, 3, 4, 8, 7, 6, 5]
      explanation: |
        With two rows, the trip back along the bottom finishes the matrix. There is
        no left column left to climb.
    - input: |
        spiral_order([[1], [2], [3]])
      output: |
        [1, 2, 3]
    - input: |
        spiral_order([])
      output: |
        []
