schema_version: 1
id: katas/rebuild-a-tree-from-traversals
kind: kata
title: Rebuild a Tree From Traversals
difficulty: medium
tags: [trees, recursion, hash-map, invariants]
estimated_minutes: 32

prompt: |
  Rebuild a binary tree from its pre-order and in-order traversals.

  Pre-order visits a node, then its left subtree, then its right. In-order
  visits the left subtree, then the node, then the right. Both lists hold the
  same values, all **distinct**. Empty lists give an empty tree.

  Aim for `O(n)`. The obvious recursion is `O(n^2)` because of one repeated
  lookup — find it and remove it. Leave both lists as you found them.

  Build the tree out of the `TreeNode` class in the stub, which is what the
  tests inspect.

hints:
  - "Pre-order visits the root first, so `preorder[0]` is the root. In-order
     visits the whole left subtree before the root, so finding the root in
     `inorder` splits it into the two subtrees."
  - "That split gives you the left subtree's *size*, which is what lets you cut
     the pre-order list in the same place: the next `size` values after the
     root are the left subtree's pre-order."
  - "Searching `inorder` for the root on every call is the O(n) step that makes
     the whole thing quadratic. Build a value-to-index dictionary once up
     front."
  - "Pass index ranges rather than slicing the lists. Slicing copies, so it
     reintroduces the linear cost you just removed."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(n)"
    expected_space: "O(n)"
  constraints:
    - "0 <= len(preorder) <= 10**5, and len(inorder) == len(preorder)"
    - "-10**9 <= value <= 10**9, and no value appears twice."
    - "The two lists are traversals of one tree, which is at most 500 levels deep."
  examples:
    - input: |
        rebuild([3, 9, 20, 15, 7], [9, 3, 15, 20, 7])
      output: |
        TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
      explanation: |
        The first pre-order value, 3, is the root. In-order, everything before the 3
        is its left subtree and everything after it is its right.

                3
               / \
              9  20
                /  \
               15   7
    - input: |
        rebuild([1, 2], [2, 1])
      output: |
        TreeNode(1, TreeNode(2))
      explanation: |
        In-order, 2 comes before the root, so it is the left child.
    - input: |
        rebuild([1, 2], [1, 2])
      output: |
        TreeNode(1, None, TreeNode(2))
      explanation: |
        The same pre-order as the example above. In-order, 2 now comes after the
        root, so it is the right child — which is why one traversal is not enough.
    - input: |
        rebuild([], [])
      output: |
        None
