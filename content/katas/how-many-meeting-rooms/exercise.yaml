schema_version: 1
id: katas/how-many-meeting-rooms
kind: kata
title: How Many Meeting Rooms
difficulty: medium
tags: [intervals, heap, sorting, counting]
estimated_minutes: 28

prompt: |
  Given meeting intervals, return the fewest rooms needed to hold all of them.

  A meeting ending exactly when another starts does **not** need a second room:
  `(1, 2)` and `(2, 3)` share one. Every meeting has positive duration.

  Aim for `O(n log n)`.

hints:
  - "The answer is the largest number of meetings running at the same moment --
     so you are looking for a maximum overlap, not an arrangement of rooms."
  - "You only need to look at the moments when something changes: a meeting
     starting or a meeting ending. Between events the count is constant."
  - "So build two sorted lists -- all the starts, all the ends -- and sweep
     through them in time order, adding one at each start and subtracting one
     at each end. Track the peak."
  - "At a tie, process the **end** before the start, or two meetings that
     merely touch will be counted as overlapping."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n log n)"
    expected_space: "O(n)"
  signature:
    functions:
      - name: rooms_needed
        summary: Return the fewest rooms that can hold all the meetings.
        parameters:
          - name: meetings
            type: list[tuple[int, int]]
            description: >-
              `(start, end)` pairs with `start < end`, in any order. May be empty and
              may repeat. A meeting ending when another starts shares its room.
            length: {min: 0, max: 2 * 10**5}
            values: {min: -10**9, max: 10**9}
        returns:
          type: int
          description: The maximum number of meetings running simultaneously.
  notes:
    - "Each meeting is a pair (start, end) with start < end."
    - Meetings arrive in no particular order and may repeat.
  examples:
    - input: |
        rooms_needed([(0, 30), (5, 10), (15, 20)])
      output: |
        2
      explanation: |
        The long meeting needs a room for the whole half hour. The two short ones do
        not overlap each other, so they can share a second.
    - input: |
        rooms_needed([(7, 10), (2, 4)])
      output: |
        1
    - input: |
        rooms_needed([(1, 2), (2, 3)])
      output: |
        1
      explanation: |
        The first meeting has left by the time the second arrives.
    - input: |
        rooms_needed([(1, 5), (1, 5), (1, 5)])
      output: |
        3
