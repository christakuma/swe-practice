schema_version: 1
id: katas/longest-run-after-k-replacements
kind: kata
title: Longest Run After K Replacements
difficulty: medium
tags: [strings, sliding-window, counting]
estimated_minutes: 32

prompt: |
  You may change at most `k` characters of the string, each to any character.
  Return the length of the longest run of a single repeated character you can
  produce.

  `k` may exceed the length of the string, in which case the whole string can
  be made uniform. Every character is significant, and case matters.

  Aim for `O(n)` time. Trying every substring is `O(n^2)` even with counts
  cached.

hints:
  - "A substring can be made uniform with at most k changes exactly when
     `length - (count of its most common character)` is at most k -- every
     other character has to be replaced."
  - "That is a condition on a window, and it gets *harder* to satisfy as the
     window grows. So grow a window on the right and shrink it on the left
     whenever it stops satisfying the condition."
  - "Keep a tally of the characters in the window, updated as each end moves.
     The most common character's count is what the condition needs."
  - "Once you have it working, look at what happens if you never *decrease*
     your record of the most common count. The answer stays correct -- work out
     why, because it is the most interesting thing in this problem."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(n)"
    expected_space: "O(k) for k distinct characters"
  constraints:
    - "0 <= len(text) <= 10**6"
    - "0 <= k <= 10**6"
    - "The string may hold any characters, not only letters."
  examples:
    - input: |
        longest_run("ABAB", 2)
      output: |
        4
      explanation: |
        Change both B's, or both A's.
    - input: |
        longest_run("AABABBA", 1)
      output: |
        4
      explanation: |
        Changing the first B gives "AAAABBA", whose first four characters match.
    - input: |
        longest_run("ABCDE", 0)
      output: |
        1
      explanation: |
        With no changes allowed, the longest run is whatever is already there.
    - input: |
        longest_run("AB", 5)
      output: |
        2
