schema_version: 1
id: katas/median-of-a-stream
kind: kata
title: Median of a Stream
difficulty: hard
tags: [heap, invariants, scanning, counting]
estimated_minutes: 35

prompt: |
  Numbers arrive one at a time. After any number of them, you may be asked for
  the median so far.

  - `add(value)` — take the next number.
  - `median()` — the median of everything added, always as a float. With an
    even count it is the **average of the two middle values**.

  Calling `median()` before anything is added raises `ValueError`. Values may
  repeat, and each repeat counts.

  `add` must be `O(log n)` and `median` `O(1)`. Keeping a sorted list and
  inserting into it makes `median` cheap and `add` `O(n)`; re-sorting on every
  query is worse. The tests add enough values that neither finishes.

hints:
  - "You never need the whole collection ordered -- only the one or two values
     in the middle. So keep the numbers in two halves and make the middle the
     part you can reach."
  - "A max-heap over the smaller half and a min-heap over the larger half put
     the two middle values at the two heap tops."
  - "Python's `heapq` is a min-heap only. Store the smaller half negated to get
     a max-heap out of it."
  - "After each insertion, restore two invariants: every value in the low half
     is at most every value in the high half, and the two sizes differ by at
     most one. Push, then move one element across, then rebalance."
  - "Pushing onto the low half and immediately moving its top to the high half
     enforces the ordering invariant without comparing anything."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 20
  complexity:
    expected_time: "O(log n) per add, O(1) per median"
    expected_space: "O(n)"
  constraints:
    - "-10**6 <= value <= 10**6, and every value is an integer."
    - "At most 10**5 values are added to one stream."
    - "median() may be called after every single add."
  examples:
    - input: |
        stream = MedianStream()
        stream.add(1)
        stream.median()
      output: |
        1.0
    - input: |
        stream = MedianStream()
        stream.add(1)
        stream.add(3)
        stream.median()
      output: |
        2.0
      explanation: |
        An even count, so the average of the two middle values: (1 + 3) / 2.
    - input: |
        stream = MedianStream()
        for value in [5, 1, 4]:
            stream.add(value)
        stream.median()
      output: |
        4.0
      explanation: |
        In order the values are 1, 4, 5. The middle one is 4, returned as a float
        even though it is a whole number.
