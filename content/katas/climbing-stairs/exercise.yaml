schema_version: 1
id: katas/climbing-stairs
kind: kata
title: Ways to Climb the Stairs
difficulty: easy
tags: [dynamic-programming, recurrence, counting]
estimated_minutes: 15

prompt: |
  Count the distinct ways to climb a staircase, taking one or two steps at a
  time.

  Order matters: a one-step followed by a two-step is a different way from a
  two-step followed by a one-step.

  The count grows quickly — the answer for a few hundred steps has over a
  hundred digits — and the obvious recursion is far too slow to reach it.

hints:
  - "Ask what the *last* step was. There are only two possibilities, and each
     one leaves a smaller version of the same problem behind."
  - "If the last step was a single, you came from `n-1`. If it was a double, from
     `n-2`. Those two sets of routes share nothing and cover everything, so the
     counts add."
  - "`ways(0) = 1`, not 0: there is exactly one way to climb no steps, which is
     to take none. Set it to 0 and every answer collapses to 0."
  - "Write it as a loop from the bottom up rather than as recursion. The
     recurrence only ever looks back two places, so two variables are enough —
     no table and no cache."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(1)"
  constraints:
    - "0 <= steps <= 500"
    - "The answer is exact however large it is; Python integers do not overflow."
  examples:
    - input: |
        ways_to_climb(2)
      output: |
        2
      explanation: |
        1+1, or 2.
    - input: |
        ways_to_climb(3)
      output: |
        3
      explanation: |
        1+1+1, 1+2, or 2+1.
    - input: |
        ways_to_climb(5)
      output: |
        8
    - input: |
        ways_to_climb(0)
      output: |
        1
      explanation: |
        There is exactly one way to climb no steps: take none.
