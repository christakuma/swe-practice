schema_version: 1
id: katas/shortest-path-in-a-grid
kind: kata
title: Shortest Path Through a Grid
difficulty: medium
tags: [graphs, grids, bfs, shortest-path]
estimated_minutes: 25

prompt: |
  Return the fewest cells on a route from the top-left of a grid to the
  bottom-right, moving only up, down, left or right, and never entering a cell
  holding `1`.

  Count both ends: the answer for a `1 x 1` open grid is `1`. Return `-1` when
  there is no route — which includes a start or a destination that is itself a
  wall, and a grid with no cells at all.

  You may modify the grid.

hints:
  - "This is the grid-as-a-graph problem again, but \"shortest\" changes which
     search you can use. Think about what depth-first search would report on a
     grid with two routes of different lengths."
  - "Breadth-first search finishes everything at distance 1 before it starts
     anything at distance 2, so the first time it reaches a cell is by the
     fewest steps. That property is the entire reason to use it here."
  - "A queue of `(row, column, steps)`. Take from the front, push each open
     neighbour with `steps + 1`, and return as soon as you take the destination
     off the queue."
  - "Mark a cell as seen when you *push* it, not when you pop it. Marking on pop
     lets the same cell enter the queue once for every neighbour that reaches
     it."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(rows * columns)"
    expected_space: "O(rows * columns)"
  constraints:
    - "The grid has at most 200 rows and 200 columns, and may be empty."
    - "Every row is the same length, and every cell is 0 (open) or 1 (wall)."
  examples:
    - input: |
        grid = [
            [0, 0, 0],
            [0, 0, 0],
            [0, 0, 0],
        ]
        shortest_path(grid)
      output: |
        5
      explanation: |
        Two moves right and two down, in any order, visit five cells counting both
        ends.
    - input: |
        grid = [
            [0, 1, 0],
            [0, 1, 0],
            [0, 0, 0],
        ]
        shortest_path(grid)
      output: |
        5
      explanation: |
        The wall leaves one way through: down the left side and along the bottom.
    - input: |
        grid = [
            [0, 1],
            [1, 0],
        ]
        shortest_path(grid)
      output: |
        -1
      explanation: |
        Both ways out of the start are walls, and diagonal moves are not allowed.
    - input: |
        shortest_path([[0]])
      output: |
        1
