schema_version: 1
id: katas/fewest-intervals-to-remove
kind: kata
title: Fewest Intervals to Remove
difficulty: medium
tags: [intervals, greedy, sorting, invariants]
estimated_minutes: 28

prompt: |
  Given a list of intervals, return the **smallest number you must remove** so
  that none of the rest overlap.

  Intervals that merely **touch** do not overlap: `(1, 2)` and `(2, 3)` may both
  stay. Two identical intervals do overlap, so only one of them can.

  Aim for `O(n log n)`.

hints:
  - "Removing the fewest is the same as *keeping* the most. Flip the problem --
     counting what survives is much easier to reason about than choosing what
     to delete."
  - "Build the surviving set greedily, one interval at a time, always taking
     the next compatible one. The question is which order to consider them in."
  - "Sort by **end**, not by start. Among the intervals you could take next,
     the one finishing earliest leaves the most room for everything after it."
  - "Then walk the sorted list keeping a running \"last end kept\". Take an
     interval when its start is at least that value; otherwise it has to go."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n log n)"
    expected_space: "O(n) for the sort"
  signature:
    functions:
      - name: fewest_removals
        summary: Return the fewest intervals to remove so the rest do not overlap.
        parameters:
          - name: intervals
            type: list[tuple[int, int]]
            description: >-
              `(start, end)` pairs in any order. May be empty and may repeat. Touching
              intervals do not overlap.
            length: {min: 0, max: 2 * 10**5}
            values: {min: -10**9, max: 10**9}
        returns:
          type: int
          description: The minimum number of intervals to delete.
  notes:
    - "Each interval is a pair (start, end) with start <= end."
    - Intervals arrive in no particular order and may repeat.
  examples:
    - input: |
        fewest_removals([(1, 2), (2, 3), (3, 4), (1, 3)])
      output: |
        1
      explanation: |
        Remove (1, 3). The other three only touch at their ends, so they can all
        stay.
    - input: |
        fewest_removals([(1, 10), (2, 3), (4, 5)])
      output: |
        1
      explanation: |
        The long interval overlaps both short ones. Removing it keeps two; keeping
        it would cost two.
    - input: |
        fewest_removals([(1, 2), (1, 2), (1, 2)])
      output: |
        2
    - input: |
        fewest_removals([(1, 2), (2, 3)])
      output: |
        0
