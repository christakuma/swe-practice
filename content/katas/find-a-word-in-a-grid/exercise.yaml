schema_version: 1
id: katas/find-a-word-in-a-grid
kind: kata
title: Find a Word in a Grid
difficulty: medium
tags: [grids, backtracking, dfs, recursion]
estimated_minutes: 30

prompt: |
  A grid of single characters and a word come in. Return `True` if the word can
  be spelled by a path through the grid that steps only up, down, left or
  right, and **uses no cell twice**.

  Diagonal steps are not allowed. The empty word is present in any grid,
  including an empty one.

  The case that matters is a word whose letters are all there but which needs
  the same cell twice. A search that forgets what it has already stepped on
  returns `True` for it.

  Leave the board as you found it.

hints:
  - "From each starting cell, walk the word one letter at a time. At each step
     you have up to four neighbours to try, and you only need one of them to
     work out."
  - "That is depth-first search where the state is (position in the grid,
     position in the word). Succeed when the word is used up; fail when the
     cell does not match or you have stepped off the grid."
  - "The no-reuse rule is about the current path, not the whole search. A cell
     that fails on this path may well be needed on another one, so a permanent
     visited set is wrong."
  - "So mark the cell before recursing and *unmark it afterwards*. Writing a
     sentinel into the board and restoring the original letter on the way out
     needs no extra structure at all."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(m * n * 4^L) worst case, for a word of length L"
    expected_space: "O(L) for the recursion"
  constraints:
    - "0 <= rows <= 10 and 0 <= columns <= 10"
    - "0 <= len(word) <= 20"
    - "Every cell is a single character. Matching is exact, so case matters."
  examples:
    - input: |
        board = [
            ["A", "B", "C", "E"],
            ["S", "F", "C", "S"],
            ["A", "D", "E", "E"],
        ]
        exists(board, "ABCCED")
      output: |
        True
      explanation: |
        Along the top row to the C, down to the C below it, down again to E, then
        left to D.
    - input: |
        board = [
            ["A", "B", "C", "E"],
            ["S", "F", "C", "S"],
            ["A", "D", "E", "E"],
        ]
        exists(board, "SEE")
      output: |
        True
      explanation: |
        The S at the end of the middle row, down to the E below it, then left.
    - input: |
        board = [
            ["A", "B", "C", "E"],
            ["S", "F", "C", "S"],
            ["A", "D", "E", "E"],
        ]
        exists(board, "ABCB")
      output: |
        False
      explanation: |
        A, B and C are there in a row, but the only B next to that C is the one
        already used.
