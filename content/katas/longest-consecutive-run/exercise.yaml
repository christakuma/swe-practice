schema_version: 1
id: katas/longest-consecutive-run
kind: kata
title: Longest Consecutive Run
difficulty: medium
tags: [arrays, hash-map, counting, invariants]
estimated_minutes: 25

prompt: |
  Return the length of the longest run of consecutive integers present in the
  list. The values need not be adjacent in the list, and order does not matter.

  ```
  longest_run([100, 4, 200, 1, 3, 2])     ->  4     # 1, 2, 3, 4
  longest_run([0, 3, 7, 2, 5, 8, 4, 6])   ->  7     # 2..8
  longest_run([])                          ->  0
  longest_run([5, 5, 5])                   ->  1
  ```

  Duplicates do not lengthen a run. The values may be negative.

  **`O(n)`.** Sorting makes this easy and is `O(n log n)`, so it is banned —
  and the linear solution is a genuinely different idea rather than a tuned
  version of the same one.

hints:
  - "Put everything in a set first. Now \"is x + 1 present?\" is a constant-time
     question, and a run can be walked upward from any of its members."
  - "Walking up from every value is quadratic on a single long run -- each of
     its members walks the whole thing. You only want to walk once per run."
  - "A run has exactly one value that can start it: the one whose predecessor
     is absent. Check for that before walking, and each run is walked exactly
     once."
  - "That is what keeps it linear despite the nested loop: the outer loop
     visits every value, and the inner loop's *total* work across the whole run
     is the run's length."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 15
  complexity:
    expected_time: "O(n)"
    expected_space: "O(n)"
