schema_version: 1
id: katas/top-k-frequent
kind: kata
title: Top K Most Frequent Words
difficulty: medium
tags: [hash-map, sorting, counting, heap]
estimated_minutes: 18

prompt: |
  Return the `k` most frequent words in a list, most frequent first. Words that
  appear the same number of times are ordered **alphabetically**, by ordinary
  string comparison.

  The list may be long.

hints:
  - "Two steps: count, then order. The counting is a dict from word to how many
     times you saw it, in one pass."
  - "The ordering is where the problem is. Counts go *down* and tied words go
     *up*, so a single `reverse=True` cannot express it — it would reverse the
     alphabetical half too."
  - "Python sorts tuples element by element, ascending. So a key of
     `(-count, word)` gives descending counts and ascending words from one
     ordinary sort."
  - "`collections.Counter` does the counting, but `most_common` breaks ties by
     first-seen order, not alphabetically. Sort the keys yourself with the
     explicit key."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n + d log d) for d distinct words"
    expected_space: "O(d)"
  signature:
    functions:
      - name: top_k_frequent
        summary: Return the k most frequent words, most frequent first.
        parameters:
          - name: words
            type: list[str]
            description: the words to count. May be empty.
            length: {min: 0, max: 10**5}
            item_length: {min: 1, max: 20}
          - name: k
            type: int
            description: how many to return. Never larger than the number of distinct words.
        returns:
          type: list[str]
          description: >-
            The k most frequent words, ordered by count descending. Words with the same
            count are ordered alphabetically.
  notes:
    - "0 <= k <= the number of distinct words"
  examples:
    - input: |
        top_k_frequent(["b", "a", "a", "b", "a"], 2)
      output: |
        ["a", "b"]
      explanation: |
        "a" appears three times and "b" twice.
    - input: |
        top_k_frequent(["pear", "apple", "fig"], 3)
      output: |
        ["apple", "fig", "pear"]
      explanation: |
        Every word appears once, so the whole order is the alphabetical tie-break.
    - input: |
        top_k_frequent(["cat", "cat", "zebra", "ant"], 3)
      output: |
        ["cat", "ant", "zebra"]
      explanation: |
        "cat" leads on count. "ant" and "zebra" tie, and tie alphabetically.
    - input: |
        top_k_frequent(["a", "b"], 0)
      output: |
        []
