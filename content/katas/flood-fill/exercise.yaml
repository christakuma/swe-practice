schema_version: 1
id: katas/flood-fill
kind: kata
title: Flood Fill
difficulty: easy
tags: [graphs, grids, dfs, in-place]
estimated_minutes: 15

prompt: |
  Recolour the connected region of an image that contains a given pixel — the
  paint-bucket tool.

  Two pixels are in the same region when they touch up, down, left or right and
  **started** with the same colour. Diagonals do not connect.

  Modify the image in place and return it. An empty image is returned as it
  is.

hints:
  - "It is the same walk as counting islands: from the starting pixel, visit
     every neighbour that has the original colour, and paint as you go."
  - "Capture the original colour *before* you paint anything. Once the first
     pixel is repainted, the thing you were matching against is gone."
  - "Now try filling a region with the colour it already has. The painting is
     your visited marker, so painting a pixel its own colour marks nothing —
     and the walk goes round between two neighbours for ever."
  - "Return early when the new colour equals the original. Then write the walk
     with an explicit stack: ninety thousand connected pixels is ninety thousand
     recursive frames."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(rows * columns)"
    expected_space: "O(rows * columns) for the stack in the worst case"
  constraints:
    - "0 <= rows <= 300 and 1 <= columns <= 300"
    - "0 <= colour <= 10**6, for the new colour and for every pixel."
    - "(row, column) is a pixel of the image whenever the image has any."
    - "A region may cover the whole image: 90,000 pixels, far deeper than Python will recurse."
  examples:
    - input: |
        image = [
            [1, 1, 1],
            [1, 1, 0],
            [1, 0, 1],
        ]
        flood_fill(image, 1, 1, 2)
      output: |
        [[2, 2, 2], [2, 2, 0], [2, 0, 1]]
      explanation: |
        The 1 in the bottom-right corner touches the region only diagonally, so it
        keeps its colour.
    - input: |
        image = [[0, 0], [0, 0]]
        flood_fill(image, 0, 0, 0)
      output: |
        [[0, 0], [0, 0]]
      explanation: |
        The region is already the colour it is being filled with, so nothing
        changes.
    - input: |
        image = [[5, 5, 3]]
        result = flood_fill(image, 0, 0, 7)
        (result is image, image)
      output: |
        (True, [[7, 7, 3]])
      explanation: |
        The image is recoloured in place, and what comes back is the same list that
        went in.
