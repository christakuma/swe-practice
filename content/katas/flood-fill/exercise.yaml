schema_version: 1
id: katas/flood-fill
kind: kata
title: Flood Fill
difficulty: easy
tags: [graphs, grids, dfs, in-place]
estimated_minutes: 15

prompt: |
  Recolour the connected region of an image that contains a given pixel — the
  paint-bucket tool.

  Two pixels are in the same region when they touch up, down, left or right and
  **started** with the same colour. Diagonals do not connect.

  ```
  1 1 1                 2 2 2
  1 1 0   fill(1,1,2)   2 2 0
  1 0 1                 2 0 1      the bottom-right 1 is only diagonally
                                   connected, so it stays
  ```

  Modify the image in place and return it. The image may be a few hundred
  pixels on a side.

hints:
  - "It is the same walk as counting islands: from the starting pixel, visit
     every neighbour that has the original colour, and paint as you go."
  - "Capture the original colour *before* you paint anything. Once the first
     pixel is repainted, the thing you were matching against is gone."
  - "Now try filling a region with the colour it already has. The painting is
     your visited marker, so painting a pixel its own colour marks nothing —
     and the walk goes round between two neighbours for ever."
  - "Return early when the new colour equals the original. Then write the walk
     with an explicit stack: ninety thousand connected pixels is ninety thousand
     recursive frames."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(rows * columns)"
    expected_space: "O(rows * columns) for the stack in the worst case"
