schema_version: 1
id: katas/maximum-product-subarray
kind: kata
title: Maximum Product Subarray
difficulty: medium
tags: [arrays, dynamic-programming, kadane, invariants]
estimated_minutes: 28

prompt: |
  Return the largest product of any **contiguous** non-empty run of values.

  The run must contain at least one value, so a list of only negatives can
  have a negative answer.

  Comparing every run is `O(n^2)`. Do it in one pass.

hints:
  - "This looks like `maximum-subarray` with multiplication in place of
     addition. Try carrying \"the best product ending here\" forward and see
     where it breaks."
  - "It breaks on negatives. A negative multiplied by a large negative becomes
     a large positive -- so the *worst* product ending at a position is just as
     useful as the best one, and you have thrown it away."
  - "Carry both. At each value the new best is the largest of three candidates:
     the value alone, the value times the previous best, the value times the
     previous worst. The new worst is the smallest of the same three."
  - "Compute both from the *old* pair. Overwrite the best first and the worst
     will be computed from a value that no longer exists -- so read both before
     writing either."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(1)"
  constraints:
    - "1 <= len(numbers) <= 10**5"
    - "-10 <= numbers[i] <= 10"
    - "Every run's product is small enough to be an ordinary 64-bit integer."
  examples:
    - input: |
        max_product([2, 3, -2, 4])
      output: |
        6
      explanation: |
        2 * 3. Carrying on through the -2 turns everything after it negative.
    - input: |
        max_product([-2, 3, -4])
      output: |
        24
      explanation: |
        The whole list: the two negatives cancel.
    - input: |
        max_product([-2, 0, -1])
      output: |
        0
      explanation: |
        The zero on its own beats either negative, and no run can cross it without
        becoming zero.
    - input: |
        max_product([-3])
      output: |
        -3
      explanation: |
        The run cannot be empty, so the only value is the answer.
