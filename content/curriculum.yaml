# The order the library is offered in.
#
# Hand-ordered, which is the answer PLAN.md section 15 question 4 said to start
# with and section 16 records revisiting at fifty-four exercises: still hand
# ordered, now written down (docs/adr/0014-a-hand-ordered-curriculum-manifest.md).
#
# Tracks here are pedagogical and finer than the three directories on disk. An
# exercise id is exactly <track>/<slug> and the loader enforces two path
# segments, so `git/`, `katas/` and `sql/` are all the filesystem can express;
# the eleven runs below are a second grouping over the same files, and nothing
# is moved to express them.
#
# Within a track the order is difficulty and dependency: an exercise should only
# need ideas the ones above it have already introduced. Across tracks it is
# interleaved on purpose -- git and katas alternate, because the point of the
# tool is to practise both and a solver working down the list should not spend a
# fortnight on one before meeting the other.
#
# `practice validate` requires this file to name every exercise exactly once and
# nothing that is not on disk, so an exercise added without a line here fails
# rather than quietly appearing at the end.

tracks:
  # Deliberately mixed, and deliberately exactly six long -- which is the
  # dashboard's queue limit, so this track *is* the product's front page on a
  # fresh install. A first track of six git exercises would push every kata off
  # the screen entirely; interleaving at track granularity does not interleave
  # the first thing anybody sees. Found by an e2e test that asked for Two Sum on
  # the dashboard and could not find it, and now asserted directly by
  # `test_the_first_screen_of_the_curriculum_offers_every_kind`.
  #
  # Phase 14 is what made it exactly six. With two kinds, four rows left room to
  # spare; with three kinds and a six-row screen there is exactly one slot each
  # for two of each, and no slack at all. A fourth kind would force a decision
  # here rather than an append -- which is the right place for that decision to
  # be forced.
  - name: start-here
    title: "Start here: one of each, nothing clever"
    exercises:
      - git/publish-a-branch-for-review
      - katas/two-sum
      - sql/newest-customers-first
      - git/amend-the-last-commit
      - katas/valid-parentheses
      - sql/one-row-per-customer

  - name: git-foundations
    title: "Git: the operations you undo things with"
    exercises:
      - git/move-commits-off-main
      - git/squash-fixups-before-pushing
      - git/drop-a-secret-from-a-commit
      - git/split-a-commit-into-two

  - name: arrays-strings-hashing
    title: "Katas: arrays, strings and hashing"
    exercises:
      - katas/move-zeroes
      - katas/longest-common-prefix
      - katas/group-anagrams
      - katas/longest-substring-without-repeats
      - katas/merge-intervals
      - katas/top-k-frequent
      - katas/product-except-self
      - katas/subarray-sum-equals-k

  # Added with the Blind 75 fill-in. Extends `arrays-strings-hashing` rather
  # than replacing it: those eight are about the hash map, these four are about
  # the two-pointer walk and the running accumulator.
  #
  # `maximum-product-subarray` came in with this batch and is *not* here -- it
  # went into `dynamic-programming` directly after `maximum-subarray`, because
  # its whole lesson is which property of Kadane's algorithm fails when the
  # operator changes, and that argument is unreadable before the original.
  #
  # The two two-pointer exercises are deliberately adjacent and deliberately
  # unalike: `three-sum-to-zero`'s pointers move because the data is sorted,
  # `the-largest-container`'s move because of a domination argument about the
  # objective. Same mechanics, unrelated justifications, and conflating them is
  # how people come to believe two pointers requires sorted input.
  - name: arrays-and-two-pointers
    title: "Katas: two pointers and running state"
    exercises:
      - katas/contains-a-duplicate
      - katas/best-time-to-buy-and-sell
      - katas/three-sum-to-zero
      - katas/the-largest-container

  - name: sql-reading
    title: "SQL: asking the right question"
    exercises:
      - sql/the-two-biggest-spenders
      - sql/the-null-that-broke-the-report
      - sql/use-the-index-you-were-given

  # Added with the Blind 75 fill-in. The library had `strings` as a tag on six
  # exercises but no track: string work was scattered through
  # `arrays-strings-hashing` wherever it happened to fit.
  #
  # Ordered so each technique is introduced before it is relied on. The two
  # palindrome-counting exercises are adjacent and share an expansion routine
  # verbatim -- the second changes one line of the consumer, which is the
  # point of having both. The two sliding-window exercises are likewise a pair:
  # `longest-run-after-k-replacements` establishes that the window predicate
  # must be monotone in the window's size, and `smallest-window-covering` is
  # the hard case where maintaining that predicate in O(1) is the entire
  # problem.
  #
  # `encode-and-decode-strings` is last and is not an algorithm exercise at
  # all -- it is the one place in the library where the solver designs a
  # format, and the only one whose tests assert a round-trip property rather
  # than expected values.
  - name: strings-and-windows
    title: "Katas: strings, windows and formats"
    exercises:
      - katas/is-it-an-anagram
      - katas/is-it-a-palindrome
      - katas/longest-palindromic-substring
      - katas/count-palindromic-substrings
      - katas/longest-run-after-k-replacements
      - katas/smallest-window-covering
      - katas/encode-and-decode-strings

  - name: git-recovery
    title: "Git: getting work back"
    exercises:
      - git/restore-a-file-deleted-long-ago
      - git/rescue-a-forgotten-stash
      - git/recover-a-lost-commit
      - git/restore-a-deleted-branch
      - git/rescue-commits-from-a-detached-head
      - git/undo-a-merge-you-have-not-pushed
      - git/undo-a-rebase-with-orig-head

  - name: trees-and-graphs
    title: "Katas: trees and graphs"
    exercises:
      - katas/max-depth-of-a-binary-tree
      - katas/level-order-traversal
      - katas/validate-a-binary-search-tree
      - katas/lowest-common-ancestor
      - katas/flood-fill
      - katas/count-islands
      - katas/shortest-path-in-a-grid
      - katas/detect-a-dependency-cycle
      - katas/topological-order

  # Added with the Blind 75 fill-in. Ordered by dependency rather than by
  # difficulty alone: the three-pointer reversal and the fast/slow pair are both
  # prerequisites for `reorder-a-linked-list`, which is those two composed, and
  # the two-list merge is a prerequisite for the k-list one, which is the same
  # merge with a heap deciding what to merge next.
  #
  # `detect-a-cycle-in-a-linked-list` moved here out of `trees-and-graphs`,
  # where it was the only linked-list exercise in the library and sat among
  # trees for want of anywhere better.
  - name: linked-lists
    title: "Katas: linked lists and pointer discipline"
    exercises:
      - katas/reverse-a-linked-list
      - katas/merge-two-sorted-lists
      - katas/detect-a-cycle-in-a-linked-list
      - katas/remove-the-nth-node-from-the-end
      - katas/reorder-a-linked-list
      - katas/merge-k-sorted-lists

  # Added with the Blind 75 fill-in. The library had grid *traversal* already
  # (flood-fill, count-islands, shortest-path-in-a-grid, all in
  # `trees-and-graphs`); what it had none of was grid *index* work, where the
  # difficulty is the coordinate arithmetic and the in-place constraint rather
  # than the search.
  #
  # The first three are ordered by how much state the in-place rule forces you
  # to invent: none, four boundaries, then a marker strip hidden inside the
  # data. `find-a-word-in-a-grid` is last and is the odd one out -- it is the
  # library's first backtracking exercise, and it is here rather than in a
  # track of its own because the grid is what makes the mark-and-undo visible.
  - name: grids-and-matrices
    title: "Katas: grids, coordinates and in-place rules"
    exercises:
      - katas/rotate-a-matrix-in-place
      - katas/read-a-matrix-in-spiral-order
      - katas/zero-out-rows-and-columns
      - katas/find-a-word-in-a-grid

  # Added with the Blind 75 fill-in. Two exercises, deliberately paired: they
  # are the same structure and they want *different* binary searches, and
  # doing them in this order is the point. The minimum hunts a boundary that
  # must exist (`low < high`, `high = mid`, read the survivor); the search
  # hunts a value that may be absent (`low <= high`, `high = mid - 1`, let the
  # window close). Picking the wrong skeleton is the dominant failure mode in
  # this family, well ahead of arithmetic slips, and the contrast is what
  # teaches it.
  #
  # The `binary-search` tag already appeared on `longest-increasing-subsequence`
  # and `validate-a-binary-search-tree`; neither moved, because in those the
  # search is a step inside a different idea rather than the subject.
  - name: binary-search
    title: "Katas: binary search past the textbook case"
    exercises:
      - katas/find-the-minimum-in-a-rotated-array
      - katas/search-a-rotated-array

  - name: sql-writing
    title: "SQL: changing data and living with it"
    exercises:
      - sql/cancel-an-order-without-deleting-it
      - sql/delete-only-the-empty-carts
      - sql/a-view-the-report-can-reuse

  - name: git-collaboration
    title: "Git: working with other people"
    exercises:
      - git/pull-without-a-merge-bubble
      - git/revert-a-pushed-commit
      - git/revert-a-pushed-merge
      - git/rebase-a-feature-branch
      - git/cherry-pick-a-fix-to-a-release-branch

  - name: dynamic-programming
    title: "Katas: dynamic programming and greedy"
    exercises:
      - katas/climbing-stairs
      - katas/maximum-subarray
      - katas/maximum-product-subarray
      - katas/jump-game
      - katas/house-robber
      - katas/coin-change
      - katas/meeting-rooms
      - katas/word-break
      - katas/longest-increasing-subsequence
      - katas/knapsack
      - katas/edit-distance

  # Added with the Blind 75 fill-in, and the library's first bit-manipulation
  # exercises -- the tag did not exist before. Dependency-ordered: the
  # `n & (n - 1)` identity from the first is reused by the second, and the
  # fixed-width trap introduced by `reverse-the-bits-of-a-word` (Python
  # integers have no width, so leading zeros are the solver's problem) is what
  # `add-without-a-plus-sign` then turns into a termination bug rather than
  # merely a wrong answer.
  - name: bit-manipulation
    title: "Katas: bits, words and the width Python does not give you"
    exercises:
      - katas/count-the-set-bits
      - katas/count-bits-for-every-number-up-to-n
      - katas/find-the-missing-number
      - katas/reverse-the-bits-of-a-word
      - katas/add-without-a-plus-sign

  - name: git-conflicts
    title: "Git: conflicts and rewrites other people can see"
    exercises:
      - git/resolve-a-merge-conflict
      - git/resolve-a-conflict-during-a-rebase
      - git/force-push-your-own-branch-safely
      - git/recover-after-a-colleague-force-pushed

  - name: git-search
    title: "Git: finding out what happened"
    exercises:
      - git/find-the-commit-that-removed-a-line
      - git/find-the-first-bad-commit-with-bisect
