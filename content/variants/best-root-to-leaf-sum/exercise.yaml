schema_version: 1
id: variants/best-root-to-leaf-sum
kind: kata
title: "Best Root-to-Leaf Sum"
difficulty: medium
tags: [trees, dfs, recursion]
estimated_minutes: 20

variant:
  of: katas/best-path-sum-in-a-tree
  twist: "The path must start at the root and run all the way down to a leaf."

prompt: |
  A **root-to-leaf path** starts at the root and follows child links downwards
  until it reaches a leaf — a node with no children. Return the largest sum of
  values along any root-to-leaf path.

  The path cannot start lower down, cannot turn, and **cannot stop early**. It
  ends at a leaf even when the last few values are negative and stopping above
  them would have scored more.

  The tree is never empty. Values may be negative, so the answer can be too.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "The best path from a node down to a leaf is the node's own value plus the better of its children's best paths. What is the answer for a leaf?"
  - "Decide what a missing child is worth before you write `max`. Zero is a tempting answer and it means 'a path may end here' -- which is true only when *both* children are missing."
  - "A node with one child has one way down. The missing side is not a worse option, it is not an option, so it must never win the comparison."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h) for the recursion"
  constraints:
    - "The tree has between 1 and 10**4 nodes and is at most 500 levels deep."
    - "-1000 <= node.value <= 1000"
  examples:
    - input: |
        root = TreeNode(1, TreeNode(2), TreeNode(3))
        best_path_sum(root)
      output: |
        4
      explanation: |
        1 -> 3. The standard problem answers 6 here, by going 2 -> 1 -> 3, which
        is not a root-to-leaf path.
    - input: |
        root = TreeNode(10, TreeNode(-5))
        best_path_sum(root)
      output: |
        5
      explanation: |
        The root has a child, so it is not a leaf and the path cannot stop there.
        The only way down ends at the -5.
    - input: |
        root = TreeNode(5, TreeNode(4, TreeNode(-20)), TreeNode(1, None, TreeNode(2)))
        best_path_sum(root)
      output: |
        8
      explanation: |
        5 -> 1 -> 2. The path 5 -> 4 looks better and is not finished: it has to
        go on to the -20.
    - input: |
        best_path_sum(TreeNode(-7))
      output: |
        -7
