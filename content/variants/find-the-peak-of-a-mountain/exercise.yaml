schema_version: 1
id: variants/find-the-peak-of-a-mountain
kind: kata
title: "Find the Peak of a Mountain"
difficulty: medium
tags: [binary-search, arrays, invariants]
estimated_minutes: 20

variant:
  of: katas/find-the-minimum-in-a-rotated-array
  twist: "The list climbs and then falls instead of being sorted and rotated, and you return its largest value."

prompt: |
  A list of integers **rises strictly and then falls strictly**. Return its
  largest value — the peak.

  Either slope may be missing: a list that only rises has its peak at the end,
  and a list that only falls has it at the start. A list of one value is its
  own peak. Neighbouring values are never equal.

  Scanning for the maximum is `O(n)` and obvious. Do it in `O(log n)`. The
  tests count how many values you read.

hints:
  - "In the rotated list you compared the middle with the end to learn which half was sorted. On a mountain that comparison tells you nothing: the end can be lower than the middle on either side of the peak."
  - "Compare the middle with its right-hand neighbour instead. That tells you which slope you are standing on."
  - "If the next value is higher you are on the way up, and the peak is strictly to the right. If it is lower you are on the way down, or on the peak itself -- so the peak is here or to the left."
  - "Keep `high = middle` in the second case, not `middle - 1`: the middle may be the answer."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(log n)"
    expected_space: "O(1)"
  constraints:
    - "1 <= len(numbers) <= 2 * 10**6"
    - "-10**9 <= numbers[i] <= 10**9"
    - "For some position p: numbers[0] < ... < numbers[p] > ... > numbers[-1]."
    - "The same value may appear once on each slope, never twice in a row."
  examples:
    - input: |
        find_peak([1, 3, 7, 4, 2])
      output: |
        7
    - input: |
        find_peak([1, 2, 3, 4])
      output: |
        4
      explanation: |
        Nothing falls, so the peak is the last value.
    - input: |
        find_peak([9, 5, 1])
      output: |
        9
    - input: |
        find_peak([0, 10, 9, 8, 7, 6, 5])
      output: |
        10
      explanation: |
        The middle value, 8, is higher than the last one, 5 -- which would mean
        "the answer is to the left" in a rotated list and happens to be true
        here. In [5, 6, 7, 8, 9, 10, 0] the same comparison says the same thing
        and is wrong.
