schema_version: 1
id: variants/the-tree-seen-from-the-right
kind: kata
title: "The Tree Seen from the Right"
difficulty: medium
tags: [trees, bfs, queues]
estimated_minutes: 20

variant:
  of: katas/level-order-traversal
  twist: "Return only the last value on each level: what you would see standing to the right of the tree."

prompt: |
  Imagine standing to the right of a binary tree and looking at it side-on. On
  each level you can see one node — the **rightmost one on that level** — and
  it hides the rest. Return the values you see, from the top level down.

  An empty tree gives `[]`.

  The rightmost node on a level is not always reached by going right. Where
  the right-hand side of the tree stops short, a node from the left subtree is
  the last one on its level, and that is the one you see.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "Following right children from the root gets the first few levels and then stops as soon as the right spine ends -- even though the left subtree may go on much deeper."
  - "The answer has one value per level, so work level by level, exactly as before."
  - "Build each level left to right and keep its last value. You never need the rest of the level once you have moved past it."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(w) for the widest level"
  constraints:
    - "The tree has between 0 and 2 * 10**4 nodes; an empty tree is None."
    - "It may be a single chain that deep, far deeper than Python will recurse."
    - "-10**4 <= node.value <= 10**4"
  examples:
    - input: |
        root = TreeNode(1, TreeNode(2, None, TreeNode(5)), TreeNode(3, None, TreeNode(4)))
        right_side_view(root)
      output: |
        [1, 3, 4]
    - input: |
        root = TreeNode(1, TreeNode(2, TreeNode(4)), TreeNode(3))
        right_side_view(root)
      output: |
        [1, 3, 4]
      explanation: |
        The 4 is in the left subtree, but nothing on the right reaches its
        level, so it is what you see there.
    - input: |
        right_side_view(TreeNode(1, TreeNode(2, TreeNode(3))))
      output: |
        [1, 2, 3]
      explanation: |
        A tree that only ever goes left is visible all the way down.
    - input: |
        right_side_view(None)
      output: |
        []
