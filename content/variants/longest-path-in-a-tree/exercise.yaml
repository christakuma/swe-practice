schema_version: 1
id: variants/longest-path-in-a-tree
kind: kata
title: "Longest Path in a Tree"
difficulty: medium
tags: [trees, dfs]
estimated_minutes: 20

variant:
  of: katas/best-path-sum-in-a-tree
  twist: "Return how many nodes the longest path has, instead of the largest sum along one."

prompt: |
  A path is any sequence of nodes where each consecutive pair is joined by an
  edge, and no node appears twice. It does **not** have to pass through the
  root. Return the number of **nodes** on the longest path in the tree.

  An empty tree has no path, so the answer is `0`. A single node is a path of
  one.

  The values in the nodes do not matter here — only the shape does.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "The largest-sum version asked each node for the best *downward* path it could offer its parent, and separately considered the path that turns at that node. Both ideas carry over. What replaces \"sum\"?"
  - "Length. The best downward path from a node is one more than the longer of its children's, and an absent child offers zero."
  - "The path that turns at a node uses both children's downward paths plus the node itself. Track the largest of those seen anywhere -- it is very often not at the root."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h)"
  constraints:
    - "The tree has between 0 and 500 nodes, and may be a single chain that deep."
    - "-1000 <= node.value <= 1000"
  examples:
    - input: |
        root = TreeNode(1, TreeNode(2, TreeNode(4), TreeNode(5)), TreeNode(3))
        longest_path(root)
      output: |
        4
      explanation: |
        4, 2, 1, 3 — or 5, 2, 1, 3. Four nodes either way.

                1
               / \
              2   3
             / \
            4   5
    - input: |
        root = TreeNode(1, TreeNode(2, TreeNode(3, TreeNode(4)), TreeNode(5, None, TreeNode(6))))
        longest_path(root)
      output: |
        5
      explanation: |
        4, 3, 2, 5, 6. The longest path turns at the 2 and never reaches the root.
    - input: |
        longest_path(TreeNode(7))
      output: |
        1
    - input: |
        longest_path(None)
      output: |
        0
