schema_version: 1
id: variants/most-valuable-set-of-intervals
kind: kata
title: "Most Valuable Set of Intervals"
difficulty: hard
tags: [intervals, dynamic-programming, binary-search, sorting]
estimated_minutes: 40

variant:
  of: katas/fewest-intervals-to-remove
  twist: "Every interval has a value, and you keep the non-overlapping set worth the most rather than the largest one."

prompt: |
  Each interval is `(start, end, value)`. Choose a set of intervals, no two of
  which overlap, with the **largest total value**, and return that total.

  Intervals that merely **touch** do not overlap: `(1, 2, ...)` and
  `(2, 3, ...)` may both be chosen.

  When every value is 1 this is the standard problem turned round — keep as
  many as you can. With values, keeping many is no longer the aim: one
  interval worth 10 beats three worth 2 each.

  Aim for `O(n log n)`.

hints:
  - "Try the standard greedy -- sort by end, keep whatever fits -- on (0, 2, 1) and (0, 3, 9). Finishing early stops being a reason to keep something once intervals are worth different amounts."
  - "Sort by end anyway, and ask a yes-or-no question about each interval in turn: is it in the best set or not? If not, the answer is the best you could do with the intervals before it."
  - "If it is, the answer is its value plus the best you could do with the intervals that end at or before its start. Because they are sorted by end, those are a prefix of the list."
  - "Finding where that prefix stops is a binary search over the ends. best[i] = max(best[i-1], value + best[prefix])."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n log n)"
    expected_space: "O(n)"
  constraints:
    - "0 <= len(intervals) <= 10**5"
    - "Each interval is (start, end, value) with -10**9 <= start < end <= 10**9."
    - "1 <= value <= 10**4"
    - "Intervals arrive in no particular order and may repeat."
  examples:
    - input: |
        most_valuable([(0, 2, 1), (0, 3, 9)])
      output: |
        9
      explanation: |
        They overlap, so only one can be kept. The one that ends first is worth
        less.
    - input: |
        most_valuable([(1, 3, 5), (2, 5, 6), (4, 6, 5), (6, 7, 4)])
      output: |
        14
      explanation: |
        (1, 3), (4, 6) and (6, 7): the last two touch, which is allowed. The 6
        in the middle overlaps both of the 5s.
    - input: |
        most_valuable([(1, 2, 3), (2, 3, 3), (1, 3, 5)])
      output: |
        6
    - input: |
        most_valuable([])
      output: |
        0
