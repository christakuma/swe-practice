schema_version: 1
id: variants/cheapest-path-through-a-grid
kind: kata
title: "Cheapest Path Through a Grid"
difficulty: medium
tags: [dynamic-programming, grids, recurrence]
estimated_minutes: 20

variant:
  of: katas/count-paths-through-a-grid
  twist: "Every cell has a cost, and you return the cheapest path instead of counting the paths."

prompt: |
  Every cell of a grid holds a non-negative cost. Starting in the top-left cell
  and moving only **right or down**, find the path to the bottom-right cell
  whose cells add up to the least, and return that total.

  The total includes the first cell and the last. In a `1 x 1` grid they are
  the same cell, counted once.

  Aim for `O(rows * columns)` time. The number of paths is astronomically
  large long before the grid is.

hints:
  - "Counting paths used: paths into a cell = paths from above + paths from the left. A cheapest path into a cell also arrives from above or from the left. Which of the two would it choose?"
  - "cost[r][c] = grid[r][c] + min(cost above, cost to the left). The first row and first column have only one way in."
  - "Be careful what 'no cell there' is worth. In the counting version a missing neighbour contributed 0 paths, which was right. Here 0 would be a free route from nowhere."
  - "Always stepping to the cheaper neighbour does not work: a cheap cell can lead into an expensive corner."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(rows * columns)"
    expected_space: "O(columns)"
  constraints:
    - "1 <= rows <= 300 and 1 <= columns <= 300"
    - "Every row is the same length."
    - "0 <= grid[r][c] <= 1000"
  examples:
    - input: |
        cheapest_path([
            [1, 3, 1],
            [1, 5, 1],
            [4, 2, 1],
        ])
      output: |
        7
      explanation: |
        Along the top and down the right-hand side: 1 + 3 + 1 + 1 + 1.
    - input: |
        cheapest_path([
            [1, 2, 9],
            [9, 1, 9],
            [9, 1, 1],
        ])
      output: |
        6
    - input: |
        cheapest_path([[5]])
      output: |
        5
    - input: |
        cheapest_path([[1, 2, 3]])
      output: |
        6
      explanation: |
        One row has one path, and it visits every cell.
