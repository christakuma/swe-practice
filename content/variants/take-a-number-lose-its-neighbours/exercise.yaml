schema_version: 1
id: variants/take-a-number-lose-its-neighbours
kind: kata
title: "Take a Number, Lose Its Neighbours"
difficulty: medium
tags: [dynamic-programming, hash-map]
estimated_minutes: 30

variant:
  of: katas/house-robber
  twist: "The values that exclude each other are neighbours as numbers, not neighbours in the list."

prompt: |
  You are given a list of non-negative integers. You may **take** any value `v`:
  you gain `v` for every copy of it in the list, and every copy of `v - 1` and
  `v + 1` is then thrown away, worth nothing.

  Return the largest total you can gain.

  Where a value sits in the list is irrelevant. What matters is which numbers
  are present, how many times, and which of them are one apart. The values
  themselves can be enormous.

hints:
  - "Taking a value takes every copy of it, so first reduce the list to one number per distinct value: the value times how often it appears."
  - "Sort the distinct values. Two that are next to each other in that order exclude each other only if they differ by exactly one."
  - "Now it is the row of houses, with one change: when there is a gap between this value and the previous one, taking this one does not cost you the previous one."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n log n)"
    expected_space: "O(n)"
  constraints:
    - "0 <= len(numbers) <= 10**5"
    - "0 <= numbers[i] <= 10**9"
  examples:
    - input: |
        best_haul([3, 4, 2])
      output: |
        6
      explanation: |
        Take 4, which rules out the 3, and then take 2.
    - input: |
        best_haul([2, 2, 3, 3, 3, 4])
      output: |
        9
      explanation: |
        Taking 3 gains all three copies and discards the 2s and the 4.
    - input: |
        best_haul([1, 1000000000])
      output: |
        1000000001
      explanation: |
        The two values are nowhere near each other, so both can be taken.
