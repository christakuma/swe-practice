schema_version: 1
id: variants/trapped-rain-water
kind: kata
title: "Trapped Rain Water"
difficulty: hard
tags: [arrays, two-pointers]
estimated_minutes: 30

variant:
  of: katas/the-largest-container
  twist: "The bars are solid, and you count the water held between all of them."

prompt: |
  A list gives the height of a solid bar at each position, each one unit wide.
  After rain, water collects in the dips between bars. Return the total amount
  trapped.

  Water sits above a bar up to the height of the lower of the two tallest bars
  on either side of it. Nothing is held at either end, because there is nothing
  to hold it in.

  This is not the container problem: there, two lines held water and everything
  between them was ignored. Here every bar takes up room.

hints:
  - "Work out the water above one bar. It is decided by two numbers: the tallest bar anywhere to its left and the tallest anywhere to its right."
  - "The level there is the smaller of those two, and the water is that level minus the bar's own height, if that is positive. Two passes can record the running maximum from each side."
  - "To do it in O(1) space, walk in from both ends. Whichever side has the lower running maximum is the side whose level is already decided, so settle that bar and step inward."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(1)"
  constraints:
    - "0 <= len(heights) <= 10**6"
    - "0 <= heights[i] <= 10**4"
  examples:
    - input: |
        trapped_water([0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1])
      output: |
        6
    - input: |
        trapped_water([3, 0, 2])
      output: |
        2
      explanation: |
        The dip in the middle fills to the height of the lower side, 2.
    - input: |
        trapped_water([1, 2, 3])
      output: |
        0
      explanation: |
        The bars only rise, so everything runs off the low end.
