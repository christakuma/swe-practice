schema_version: 1
id: variants/find-the-two-swapped-values
kind: kata
title: "Find the Two Swapped Values"
difficulty: medium
tags: [trees, binary-search-tree, dfs, invariants]
estimated_minutes: 35

variant:
  of: katas/validate-a-binary-search-tree
  twist: "The tree was a valid search tree until two of its values were exchanged; say which two."

prompt: |
  A binary search tree had all-distinct values and was valid. Then the values
  of **two of its nodes were exchanged**, leaving the shape as it was. Return
  the two values as a tuple, **smaller first**.

  If nothing was exchanged and the tree is still valid, return `None`.

  The two nodes may be anywhere: a parent and its child, or far apart in
  different subtrees with nothing obviously wrong near either of them.

  The tests build trees with the `TreeNode` class in the stub.

hints:
  - "A valid search tree read in order -- left subtree, node, right subtree -- gives its values ascending. What does that sequence look like after two of its values have been exchanged?"
  - "Mostly ascending, with one or two places where a value is followed by a smaller one. Exchange two neighbours and there is one such drop. Exchange two values further apart and there are two."
  - "The larger of the misplaced values is the first value of the *first* drop. The smaller is the second value of the *last* drop."
  - "So walk in order, remembering the previous value. At the first drop record both values; at any later drop overwrite the second. You do not need to store the whole sequence."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(h)"
  constraints:
    - "The tree has between 0 and 10**4 nodes, and may be a single chain that deep."
    - "-2**31 <= node.value <= 2**31 - 1, and no two nodes share a value."
    - "Either the tree is a valid search tree, or it becomes one when exactly two values are exchanged."
  examples:
    - input: |
        swapped_values(TreeNode(1, TreeNode(3, None, TreeNode(2))))
      output: |
        (1, 3)
      explanation: |
        In order the tree reads 3, 2, 1. Exchanging the 1 and the 3 gives 1, 2,
        3.
    - input: |
        swapped_values(TreeNode(3, TreeNode(1), TreeNode(4, TreeNode(2))))
      output: |
        (2, 3)
      explanation: |
        In order: 1, 3, 2, 4. The 3 and the 2 are next to each other in that
        order, though the root and a grandchild in the tree.
    - input: |
        swapped_values(TreeNode(2, TreeNode(1), TreeNode(3)))
      output: |
        None
