schema_version: 1
id: variants/reverse-in-groups-of-k
kind: kata
title: "Reverse in Groups of k"
difficulty: hard
tags: [linked-lists, pointers, in-place]
estimated_minutes: 40

variant:
  of: katas/reverse-a-linked-list
  twist: "The list is reversed k nodes at a time, and a final group shorter than k is left as it is."

prompt: |
  Reverse a singly linked list **`k` nodes at a time** and return the new
  head. The first `k` nodes are reversed among themselves, then the next `k`,
  and so on.

  If the nodes left at the end number **fewer than `k`**, they stay in their
  original order.

  ```
  1 2 3 4 5 6 7 8     k = 3     ->     3 2 1   6 5 4   7 8
  ```

  `k` is at least 1. With `k = 1` nothing changes.

  Relink the nodes you were given rather than building new ones or moving
  values between them. The tests build lists with the `ListNode` class in the
  stub, and they check that each node still holds its own value.

hints:
  - "There are three jobs: deciding whether a full group of k remains, reversing that group, and stitching the reversed group to what comes before and after. Keep them separate."
  - "Look before you reverse. Walk k nodes ahead first; if the list runs out, stop and leave the remainder alone. Reversing first and discovering the group was short means reversing it back."
  - "A reversed group has a new first node and a new last node. The node *before* the group must point at the new first, and the new last -- which was the group's old first -- must point at whatever follows."
  - "A dummy node in front of the head removes the special case for the first group, whose 'node before' would otherwise not exist."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(1)"
  constraints:
    - "The list has between 0 and 3 * 10**4 nodes; an empty list is None."
    - "1 <= k <= 3 * 10**4"
    - "That is far longer than Python will recurse, even one call per group."
  examples:
    - input: |
        head = ListNode(1, ListNode(2, ListNode(3, ListNode(4, ListNode(5)))))
        reverse_in_groups(head, 2)
      output: |
        ListNode(2, ListNode(1, ListNode(4, ListNode(3, ListNode(5)))))
      explanation: |
        Two pairs are swapped. The 5 has no partner and stays where it is.
    - input: |
        head = ListNode(1, ListNode(2, ListNode(3, ListNode(4, ListNode(5)))))
        reverse_in_groups(head, 3)
      output: |
        ListNode(3, ListNode(2, ListNode(1, ListNode(4, ListNode(5)))))
      explanation: |
        One group of three. The last two nodes are fewer than three and keep
        their order.
    - input: |
        reverse_in_groups(ListNode(1, ListNode(2)), 5)
      output: |
        ListNode(1, ListNode(2))
