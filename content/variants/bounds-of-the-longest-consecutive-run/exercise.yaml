schema_version: 1
id: variants/bounds-of-the-longest-consecutive-run
kind: kata
title: "Bounds of the Longest Consecutive Run"
difficulty: medium
tags: [arrays, hash-map]
estimated_minutes: 20

variant:
  of: katas/longest-consecutive-run
  twist: "Return where the longest run starts and ends, not how long it is."

prompt: |
  Find the longest run of consecutive integers present in the list and return
  its **first and last values** as a tuple.

  If several runs tie for longest, return the one that starts lowest. An empty
  list has no run: return `None`.

  As in the standard version, order in the list does not matter, duplicates do
  not lengthen a run, and sorting is banned — aim for `O(n)`.

hints:
  - "The standard solution already finds each run's first value -- one with nothing just below it -- and walks up to its last. It just did not keep them."
  - "Keep the pair. Compare each run with the best so far by length, and decide what happens on a tie."
  - "A set has no order, so the runs are met in an arbitrary sequence. The tie rule has to be in the comparison, not in the order of the loop."

kata:
  language: python
  stub: stub.py
  tests: tests.py
  reference: solution.py
  time_limit_seconds: 10
  complexity:
    expected_time: "O(n)"
    expected_space: "O(n)"
  constraints:
    - "0 <= len(numbers) <= 2 * 10**5"
    - "-10**9 <= numbers[i] <= 10**9"
    - "Values arrive in no particular order and may repeat."
  examples:
    - input: |
        longest_run([100, 4, 200, 1, 3, 2])
      output: |
        (1, 4)
    - input: |
        longest_run([10, 11, 1, 2])
      output: |
        (1, 2)
      explanation: |
        Both runs are two long, and the one starting at 1 starts lower.
    - input: |
        longest_run([5, 5, 5])
      output: |
        (5, 5)
      explanation: |
        A single value is a run of one, however often it appears.
    - input: |
        longest_run([])
      output: |
        None
